<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 남의 사진(X·Threads·Instagram)을 원래 주소로 걸 때 출처를 안 보내야 막히지 않는다 -->
<meta name="referrer" content="no-referrer">
<title>Taste</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 아뜰리에 정본(DESIGN.md): 흰 바탕·직각·코발트 하나·Pretendard·그림자 없음·연회색 글자 없음 */
  :root{
    --accent:#1F4BD8; --accent-ink:#1A3FB5; --accent-soft:#EEF2FD;
    --ink:#16161A; --ink2:#5B5B66; --mut:#475569;
    --line:#ECECF0; --line2:#DCDCE3; --surface:#F8F8FA;
    --sand:#F0A647; --red:#DC2626;
  }
  *{box-sizing:border-box;border-radius:0}
  html,body{margin:0;background:#fff;color:var(--ink)}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
  h1,h2,h3{text-wrap:balance;margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 96px}

  /* 머리 */
  .mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
  .mast h1{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .mast .feed{font-size:12.5px;font-weight:500;color:var(--ink2)}
  .mast .feed b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

  /* 큰 탭 (atl-tabs + travel-tab-btn 과 같은 모양) */
  .tabsrow{display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);margin-top:20px}
  .tabs{display:flex;gap:24px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:10px 0 12px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--ink)}
  .tab .n{font-weight:500;margin-left:5px;font-variant-numeric:tabular-nums;color:var(--ink2)}
  .tab.on .n{color:var(--accent)}
  .hidden-btn{flex:none;font-size:12.5px;font-weight:600;color:var(--ink2);padding:0 0 13px;white-space:nowrap}
  .hidden-btn:hover{color:var(--ink)}
  .hidden-btn.on{color:var(--accent)}

  /* 배치 묶음 */
  .batch{margin-top:40px}
  .batch-h{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
  .batch-h h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .batch-h .c{font-size:12.5px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums}
  .batch-h::after{content:'';flex:1;height:1px;background:var(--line);align-self:center}

  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .grid.books{grid-template-columns:repeat(4,minmax(0,1fr))}

  /* 카드 */
  .card{display:flex;flex-direction:column;border:1px solid var(--line);background:#fff;min-width:0}
  .card.big{grid-column:span 2;grid-row:span 2}
  .ph{position:relative;aspect-ratio:4/3;background:var(--surface);overflow:hidden;flex:none}
  .card.big .ph{aspect-ratio:auto;flex:1 1 auto;min-height:340px}
  .card.big .body{flex:none}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  .card:hover .ph img{transform:scale(1.025)}
  .new{position:absolute;top:0;left:0;background:var(--accent);color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;padding:4px 8px;line-height:1}
  .new.inline{position:static;display:inline-block;vertical-align:middle;margin-right:8px}
  .body{display:flex;flex-direction:column;gap:10px;padding:16px 16px 14px;flex:1}
  .t{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
  .card.big .t{font-size:22px}
  .card.typo .t{font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
  .card.typo{border-top:4px solid var(--ink)}
  .card.typo.big .t{font-size:34px}
  .sub{font-size:13px;font-weight:500;color:var(--ink2);margin-top:3px}
  .src{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;max-width:100%;font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--surface);height:24px;padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  a.src:hover{color:var(--ink);background:var(--line)}
  .src i{font-style:normal;width:6px;height:6px;background:currentColor;flex:none}
  .why{background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600;line-height:1.45;padding:10px 12px}
  .detail{font-size:13px;line-height:1.55;color:var(--mut);white-space:pre-line}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;font-size:12px;font-weight:600;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
  .chip.sand{background:var(--sand);color:var(--ink)}
  .acts{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:4px}
  .b{height:32px;padding:0 11px;border:1px solid var(--line2);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
  .b:hover{border-color:var(--ink)}
  .b.on-saved{background:var(--accent);border-color:var(--accent);color:#fff}
  .b.on-done{background:var(--ink);border-color:var(--ink);color:#fff}
  .b.on-nope{border-color:var(--red);color:var(--red)}
  .map{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap}
  .map:hover{color:var(--accent-ink);text-decoration:underline}

  /* 책: 표지처럼 */
  .cover{position:relative;min-height:170px;padding:18px 18px 16px 30px;display:flex;flex-direction:column;overflow:hidden}
  .cover::before{content:'';position:absolute;left:0;top:0;bottom:0;width:12px;background:rgba(0,0,0,.18)}
  .cover.c0{background:var(--ink);color:#fff}
  .cover.c1{background:var(--accent);color:#fff}
  .cover.c2{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
  .cover.c2::before{background:var(--ink)}
  .cover.img{padding:0;background:var(--surface);aspect-ratio:3/4;min-height:0}
  .cover.img::before{display:none}
  .cover.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cover .ct{font-size:24px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
  .cover .ca{font-size:13px;font-weight:600;margin-top:10px;opacity:.85}
  .cover .cm{margin-top:auto;font-size:12px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}
  .cover .new{left:12px}
  .cover.img .new{left:0}

  /* 도시: 사진 없으면 흰 바탕 + 코발트 1px + 모래 지평선 6px (DESIGN.md 빈 도시 카드) */
  .cityph{position:relative;aspect-ratio:4/3;border:1px solid var(--accent);border-bottom:6px solid var(--sand);margin:-1px -1px 0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
  .card.big .cityph{aspect-ratio:auto;flex:1 1 auto;min-height:340px}
  .cityph .cn{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .card.big .cityph .cn{font-size:56px}
  .cityph .cc{font-size:14px;font-weight:600;color:var(--ink2);margin-top:6px}

  /* Saved 의 종류 머리 */
  .kind-h{display:flex;align-items:baseline;gap:10px;margin:40px 0 16px}
  .kind-h h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .kind-h .c{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}

  /* ── Culture (전시·공연·영화) ── 프로그램 안내지처럼: 지역 머리 → 포스터 카드 */
  .cul-ctl{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin-top:24px}
  .seg{display:inline-flex;background:var(--surface);padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:none;height:32px;padding:0 14px;font-size:13px;font-weight:600;color:var(--ink2);border:1px solid transparent;white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button .n{font-weight:500;margin-left:5px;font-variant-numeric:tabular-nums}
  .seg button.on{background:#fff;border-color:var(--ink);color:var(--ink)}
  .seg.scope button{height:36px;padding:0 18px;font-size:14px;font-weight:700}
  .seg.scope button.on .n{color:var(--accent)}

  .rg{margin-top:44px}
  .rg-h{position:sticky;top:0;z-index:3;background:#fff;display:flex;align-items:baseline;gap:10px;padding:14px 0 10px;border-bottom:2px solid var(--ink);margin-bottom:20px}
  .rg-h h2{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .rg-h .c{font-size:13px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
  .rg-h .r{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* 여행 머리: 여행 이름 크게 + 날짜 + D-day */
  .trip{margin-top:48px}
  .trip-h{position:sticky;top:0;z-index:3;background:#fff;padding:16px 0 14px;border-bottom:2px solid var(--ink);display:flex;align-items:flex-end;gap:8px 16px;flex-wrap:wrap}
  .trip-h h2{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
  .trip-h .d{font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .trip-h .chip{margin-left:auto}
  .city-h{display:flex;align-items:baseline;gap:8px;margin:24px 0 14px}
  .city-h h3{font-size:15px;font-weight:700}
  .city-h .c{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .city-h::after{content:'';flex:1;height:1px;background:var(--line);align-self:center}

  /* 전시·공연 카드 */
  .ev{display:flex;flex-direction:column}
  .ev .ph{aspect-ratio:4/5}
  .grid.evg{grid-template-columns:repeat(4,minmax(0,1fr))}
  /* 사진 없는 전시·공연 = 글자 포스터 (먹 · 코발트 · 흰 돌림) */
  .ph.tp{display:flex;flex-direction:column;justify-content:space-between;padding:16px 16px 18px}
  .ph.tp.c0{background:var(--ink);color:#fff}
  .ph.tp.c1{background:var(--accent);color:#fff}
  .ph.tp.c2{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);border-top:8px solid var(--ink)}
  .tp-k{font-size:12px;font-weight:700;letter-spacing:.02em}
  .tp-t{font-size:26px;font-weight:800;line-height:1.12;letter-spacing:-.025em;word-break:keep-all}
  .tp-v{font-size:12.5px;font-weight:600;margin-top:10px;opacity:.85}
  .ph.tp .new{left:auto;right:0}
  .ev-head{padding:16px 16px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
  .ev-foot{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
  .ev-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ev-kind{font-size:12px;font-weight:600;color:var(--ink2)}
  .venue{font-size:13px;font-weight:500;color:var(--ink2)}
  .period{font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
  .period .dash{color:var(--ink2);margin:0 6px;font-weight:400}
  .tl{position:relative;height:3px;background:var(--line);margin:6px 0 2px}
  .tl i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
  .tl b{position:absolute;top:-4px;width:2px;height:11px;background:var(--ink);transform:translateX(-1px)}
  .chip.due{background:var(--accent);color:#fff}
  .chip.on{background:var(--accent-soft);color:var(--accent-ink)}
  .chip.line{background:#fff;border:1px solid var(--line2)}
  .chip.ink{background:#fff;border:1px solid var(--ink)}
  .chips.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .chips.row::-webkit-scrollbar{display:none}
  .chips.row > *{flex:none}
  .acts .links{margin-left:auto;display:flex;gap:12px}
  .ev .acts{flex-wrap:wrap;row-gap:8px}
  .ev .b{padding:0 9px}
  .acts .links .map{margin-left:0}

  /* 영화: 2:3 포스터 */
  .ph.film{aspect-ratio:2/3}
  .film-by{font-size:12.5px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums}

  .past-btn{display:block;margin-top:48px;padding-top:14px;border-top:1px solid var(--line);width:100%;text-align:left;font-size:13px;font-weight:600;color:var(--ink2)}
  .past-btn:hover{color:var(--ink)}
  .past .card{opacity:.7}
  .empty{margin-top:56px;font-size:15px;font-weight:500;color:var(--ink2)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 14px;z-index:9}

  @media (max-width:1024px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid.books{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid.evg{grid-template-columns:repeat(3,minmax(0,1fr))}
  }
  @media (max-width:768px){
    .wrap{padding:20px 16px 72px}
    .mast .feed{width:100%}
    .grid,.grid.evg{grid-template-columns:minmax(0,1fr);gap:16px}
    .grid.books{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .card.big{grid-column:auto;grid-row:auto}
    .card.big .body{flex:1}
    .cul-ctl{flex-direction:column;align-items:stretch;gap:10px}
    .seg{width:max-content}
    .rg{margin-top:32px}
    .rg-h h2{font-size:19px}
    .trip-h h2{font-size:21px}
    /* 폰: 전시 카드는 포스터 왼쪽 + 정보 오른쪽, 아래로 나머지 */
    .ev{display:grid;grid-template-columns:116px minmax(0,1fr);grid-template-areas:"ph head" "foot foot"}
    .ev .ph{grid-area:ph;aspect-ratio:4/5}
    .ev-head{grid-area:head;padding:12px 12px 0 14px;gap:5px}
    .ev-head .t{font-size:16px}
    .ph.tp{padding:10px 10px 12px}
    .tp-t{font-size:15px;line-height:1.2}
    .tp-v{display:none}
    .tp-k{font-size:11px}
    .ev-foot{grid-area:foot;padding:12px 14px 14px}
    .period{font-size:12.5px;white-space:normal}
    .acts{flex-wrap:wrap}
    .hidden-btn{border-left:1px solid var(--line2);padding-left:12px;margin-bottom:13px;padding-bottom:0}
    .card.big .ph{flex:none;min-height:0;aspect-ratio:4/3}
    .card.big .cityph{aspect-ratio:4/3}
    .card.big .t{font-size:19px}
    .card.typo.big .t{font-size:28px}
    .card.big .cityph .cn{font-size:40px}
    .tabs{gap:18px}
    .tab{min-height:44px}
    .books .cover{padding:14px 12px 12px 22px}
    .books .cover::before{width:8px}
    .books .cover .ct{font-size:18px}
    .books .body{padding:12px 10px 12px}
    .books .why{font-size:13px;padding:8px 10px}
    .books .acts{flex-wrap:wrap}
    .books .b{padding:0 8px;font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1>Taste</h1>
    <div class="feed" id="feed">X · Threads · Instagram에서 매주 월·목</div>
  </header>
  <div class="tabsrow">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <button class="hidden-btn" id="hiddenBtn" type="button"></button>
  </div>
  <main id="view"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCdVHmS40id2qOMm6sYdHp9I4loW22lgaQ",
  authDomain: "the-atelier-99b8c.firebaseapp.com",
  projectId: "the-atelier-99b8c",
  storageBucket: "the-atelier-99b8c.firebasestorage.app",
  messagingSenderId: "820580020945",
  appId: "1:820580020945:web:d8d8d284e9e21e83eccbf0"
});
const db = firebase.firestore();
const auth = firebase.auth();
const ALLOWED_EMAIL = 'nury6942@gmail.com';

/* 데이터는 아이맥 수집기(scripts/taste/)가 tasteItems 에 쓴다. 이 화면은 status·statusAt 만 쓴다. */
const TABS = [
  { id:'place', label:'Places' },
  { id:'stay',  label:'Stays' },
  { id:'culture', label:'Culture' },
  { id:'book',  label:'Books' },
  { id:'city',  label:'Cities' },
  { id:'saved', label:'★ Saved' }
];
const SRC = { x:'X', threads:'Threads', instagram:'Instagram', stayfolio:'Stayfolio', curated:'Curated', web:'Web' };
let items = [];
let tab = 'place';
let showHidden = false;
let latestBatch = '';
let cultureSub = 'all';
let cultureScope = 'home';
try { const k = localStorage.getItem('atelier_taste_culture_kind'); if (['all','exhibition','performance','film'].includes(k)) cultureSub = k; } catch (e) {}
try { const k = localStorage.getItem('atelier_taste_culture_scope'); if (k === 'home' || k === 'trip') cultureScope = k; } catch (e) {}
let showPast = false;
const CULTURE = ['exhibition','performance','film'];
const EVENT = ['exhibition','performance'];
const SUBS = [['all','전체'],['exhibition','전시'],['performance','공연'],['film','영화']];
const pad2 = n => String(n).padStart(2,'0');
const _d = new Date(); const TODAY = _d.getFullYear() + '-' + pad2(_d.getMonth()+1) + '-' + pad2(_d.getDate());
const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
const isDate = x => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}/.test(x);
const isPast = it => { if (!EVENT.includes(it.kind)) return false; const m = it.meta || {}; if (m.permanent && !(m.trip && isDate(m.trip.end) && m.trip.end.slice(0,10) < TODAY)) return false;
  return (!m.permanent && isDate(m.end) && m.end.slice(0,10) < TODAY) || !!(m.trip && isDate(m.trip.end) && m.trip.end.slice(0,10) < TODAY); };
try { const t = localStorage.getItem('atelier_taste_tab'); if (TABS.some(x => x.id === t)) tab = t; } catch (e) {}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : '';
const safeImg = u => (typeof u === 'string' && (/^https:\/\//i.test(u) || /^data:image\/(jpeg|png|webp);base64,/i.test(u))) ? u : '';
const st = it => it.status || 'new';
const fmtLikes = n => { n = Number(n); if (!isFinite(n) || n <= 0) return ''; if (n >= 10000) return (n/1000).toFixed(0)+'K'; if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'K'; return String(n); };
const md = b => { const m = /^\d{4}-(\d{2})-(\d{2})/.exec(b || ''); return m ? (+m[1]) + '/' + m[2] : (b || '날짜 없음'); };
const hash = s => { let h = 0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h); };

function toast(msg){ const o = document.querySelector('.toast'); if (o) o.remove(); const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }

function visible(list){ return list.filter(it => showHidden ? st(it) === 'nope' : st(it) !== 'nope'); }
function ofTab(id){
  if (id === 'saved') return items.filter(it => st(it) === 'saved');
  if (id === 'culture') return items.filter(it => CULTURE.includes(it.kind));
  return items.filter(it => it.kind === id);
}

function srcChip(it){
  const s = it.src || {};
  const parts = [SRC[s.type] || s.type || ''];
  if (s.author) parts.push(String(s.author).startsWith('@') || s.type === 'curated' || s.type === 'web' ? s.author : '@' + s.author);
  const lk = fmtLikes(s.likes); if (lk) parts.push('♥' + lk);
  const label = parts.filter(Boolean).map(esc).join(' · ');
  if (!label) return '';
  const u = safeUrl(s.url);
  return u ? `<a class="src" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><i></i>${label}</a>` : `<span class="src"><i></i>${label}</span>`;
}
function actions(it){

    ${ticket || map ? `<span class="links">${ticket ? `<a class="map" href="${esc(ticket)}" target="_blank" rel="noopener noreferrer">예매 ↗</a>` : ''}${map ? `<a class="map" href="${esc(map)}" target="_blank" rel="noopener noreferrer">지도 ↗</a>` : ''}</span>` : ''}

}
const isNew = it => latestBatch && it.batch === latestBatch && st(it) === 'new';
const whyHtml = it => it.why ? `<div class="why">${esc(it.why)}</div>` : '';
const detailHtml = it => it.detail ? `<div class="detail">${esc(it.detail)}</div>` : '';
function metaChips(it){

}

function cardPlace(it, big){

/* ── Culture ── 전시·공연은 지역(국내) 또는 여행(여행지)으로 묶고, 영화는 포스터 판 */
const d10 = x => isDate(x) ? x.slice(0,10) : '';
const full = x => { x = d10(x); return x ? x.replace(/-/g, '.') : ''; };
const mdS = x => { const m = /^\d{4}-(\d{2})-(\d{2})/.exec(x || ''); return m ? (+m[1]) + '/' + (+m[2]) : ''; };
const kindWord = k => k === 'exhibition' ? '전시' : k === 'performance' ? '공연' : '영화';
function eventState(it){
  const m = it.meta || {};
  const start = d10(m.start), end = d10(m.end);
  if (m.permanent) return { k:2, sort:'', html:'<span class="chip ink">상설</span>' };
  if (end && end < TODAY) return { k:4, sort:end, html:'<span class="chip">끝남</span>' };
  if (start && start > TODAY) return { k:1, sort:start, html:`<span class="chip line">${esc(mdS(start))} 시작</span>` };
  if (end){ const d = dayDiff(TODAY, end); if (d <= 7) return { k:0, sort:end, html:`<span class="chip due">${d === 0 ? '오늘 마감' : '마감 D-' + d}</span>` }; }
  return { k:0, sort:end || '9999', html:'<span class="chip on">진행 중</span>' };
}
function timeline(it){
  const m = it.meta || {}; const s = d10(m.start), e = d10(m.end);
  if (m.permanent || !s || !e || e <= s || e < TODAY) return '';
  const p = Math.max(0, Math.min(100, dayDiff(s, TODAY) / dayDiff(s, e) * 100));
  return `<div class="tl" aria-hidden="true"><i style="width:${p.toFixed(1)}%"></i>${TODAY >= s ? `<b style="left:${p.toFixed(1)}%"></b>` : ''}</div>`;
}
function tripOverlap(it){
  const m = it.meta || {}, t = m.trip || {};
  if (m.permanent) return { k:1, html:'<span class="chip ink">상설 · 언제 가도</span>' };
  const ts = d10(t.start), te = d10(t.end), s = d10(m.start) || ts, e = d10(m.end) || te;
  if (!ts || !te) return { k:2, html:'' };
  const a = s > ts ? s : ts, b = e < te ? e : te;
  if (a <= b) return { k:0, html:`<span class="chip due">여행 중 진행 · ${esc(mdS(a))}${a === b ? '' : '–' + esc(mdS(b))} 겹침</span>` };
  return { k:3, html:'<span class="chip line">여행 때는 안 함</span>' };
}
function periodHtml(it){
  const m = it.meta || {};
  if (m.permanent) return '<div class="period">상설 · 언제 가도</div>';
  const s = full(m.start), e = full(m.end);
  if (!s && !e) return '';
  return `<div class="period">${esc(s)}<span class="dash">—</span>${esc(e)}</div>`;
}
function cardEvent(it, inTrip){
  const img = safeImg(it.image); const m = it.meta || {}; const nw = isNew(it);
  const state = inTrip ? tripOverlap(it).html : eventState(it).html;
  const venue = m.venue || it.subtitle || '';
  const chips = [];
  if (m.price) chips.push(`<span class="chip">${esc(m.price)}</span>`);
  const sc = srcChip(it); if (sc) chips.push(sc);
  const poster = img
    ? `<div class="ph"><img src="${esc(img)}" alt="" loading="lazy">${nw ? '<span class="new">NEW</span>' : ''}</div>`
    : `<div class="ph tp c${hash(it._id) % 3}" aria-hidden="true">${nw ? '<span class="new">NEW</span>' : ''}<span class="tp-k">${kindWord(it.kind)}</span><div><div class="tp-t">${esc(it.title)}</div>${venue ? `<div class="tp-v">${esc(venue)}</div>` : ''}</div></div>`;
  return `<article class="card ev">
    ${poster}
    <div class="ev-head">
      <div class="ev-top">${state}<span class="ev-kind">${kindWord(it.kind)}</span></div>
      <h3 class="t">${esc(it.title)}</h3>
      ${venue ? `<div class="venue">${esc(venue)}</div>` : ''}
      ${periodHtml(it)}
      ${inTrip ? '' : timeline(it)}
    </div>
    <div class="ev-foot">
      ${chips.length ? `<div class="chips row">${chips.join('')}</div>` : ''}
      ${whyHtml(it)}
      ${detailHtml(it)}
      ${actions(it)}
    </div>
  </article>`;
}
function cardFilm(it){
  const img = safeImg(it.image); const m = it.meta || {}; const nw = isNew(it);
  const rt = m.runtime ? (/^\d+$/.test(String(m.runtime)) ? m.runtime + '분' : m.runtime) : '';
  const by = [m.director, m.year, rt].filter(Boolean).map(esc).join(' · ') || esc(it.subtitle || '');
  const chips = [];
  if (m.where) chips.push(`<span class="chip${m.where === '극장' ? ' due' : ' on'}">${esc(m.where)}</span>`);
  if (d10(m.release) > TODAY) chips.push(`<span class="chip line">${esc(mdS(m.release))} 개봉</span>`);
  const cover = img
    ? `<div class="ph film"><img src="${esc(img)}" alt="" loading="lazy" onerror="this.closest('.ph').remove()">${nw ? '<span class="new">NEW</span>' : ''}</div>`
    : `<div class="ph film tp c${hash(it._id) % 3}" aria-hidden="true">${nw ? '<span class="new">NEW</span>' : ''}<span class="tp-k">영화</span><div><div class="tp-t">${esc(it.title)}</div>${m.director ? `<div class="tp-v">${esc(m.director)}</div>` : ''}</div></div>`;
  return `<article class="card">
    ${cover}
    <div class="body">
      <div><h3 class="t">${esc(it.title)}</h3>${by ? `<div class="film-by">${by}</div>` : ''}</div>
      ${chips.length ? `<div class="chips row">${chips.join('')}</div>` : ''}
      ${whyHtml(it)}
      ${srcChip(it)}
      ${actions(it)}
    </div>
  </article>`;
}
function sortEvents(list){
  return list.slice().sort((a, b) => { const x = eventState(a), y = eventState(b); return x.k - y.k || String(x.sort || '').localeCompare(String(y.sort || '')); });
}
const filmsSorted = l => l.filter(it => it.kind === 'film').sort((a, b) => (d10((b.meta||{}).release) > TODAY) - (d10((a.meta||{}).release) > TODAY) || String(b.batch || '').localeCompare(String(a.batch || '')));
const groupBy = (list, key) => { const g = new Map(); list.forEach(it => { const k = key(it); if (!g.has(k)) g.set(k, []); g.get(k).push(it); }); return [...g.entries()]; };
const regionOf = it => { const m = it.meta || {}; return m.region || m.city || '기타'; };

function domesticHtml(list){
  const ev = list.filter(it => EVENT.includes(it.kind));
  const groups = groupBy(ev, regionOf).sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], 'ko'));
  let out = groups.map(([r, l]) => {
    const due = l.filter(it => eventState(it).html.includes('chip due')).length;
    return `<section class="rg"><div class="rg-h"><h2>${esc(r)}</h2><span class="c">${l.length}</span>${due ? `<span class="r">곧 마감 ${due}</span>` : ''}</div>
      <div class="grid evg">${sortEvents(l).map(it => cardEvent(it, false)).join('')}</div></section>`;
  }).join('');
  const fl = filmsSorted(list);
  if (fl.length) out += `<section class="rg"><div class="rg-h"><h2>영화</h2><span class="c">${fl.length}</span></div><div class="grid books">${fl.map(cardFilm).join('')}</div></section>`;
  return out;
}
function tripsHtml(list){
  const trips = groupBy(list, it => (it.meta.trip.id || it.meta.trip.name || '여행'))
    .map(([id, l]) => ({ id, l, t: l[0].meta.trip }))
    .sort((a, b) => String(d10(a.t.start) || '9999').localeCompare(String(d10(b.t.start) || '9999')));
  return trips.map(({ l, t }) => {
    const ts = d10(t.start), te = d10(t.end);
    const dates = ts ? `${full(ts)}<span class="dash" style="margin:0 6px">—</span>${te ? (te.slice(0,4) === ts.slice(0,4) ? te.slice(5).replace('-', '.') : full(te)) : ''}` : '';
    const dd = ts ? dayDiff(TODAY, ts) : null;
    const chip = dd == null ? '' : dd > 0 ? `<span class="chip on">D-${dd}</span>` : (te && te >= TODAY ? '<span class="chip due">여행 중</span>' : '');
    const cities = groupBy(l, it => (it.meta || {}).city || regionOf(it)).sort((a, b) => b[1].length - a[1].length);
    return `<section class="trip"><div class="trip-h"><h2>${esc(t.name || '여행')}</h2>${dates ? `<span class="d">${dates}</span>` : ''}${chip}</div>
      ${cities.map(([c, cl]) => `<div class="city-h"><h3>${esc(c)}</h3><span class="c">${cl.length}</span></div>
        <div class="grid evg">${cl.slice().sort((a, b) => tripOverlap(a).k - tripOverlap(b).k || String(d10((a.meta||{}).end) || '9999').localeCompare(String(d10((b.meta||{}).end) || '9999'))).map(it => cardEvent(it, true)).join('')}</div>`).join('')}
    </section>`;
  }).join('');
}
function cultureHtml(list){
  const ev = sortEvents(list.filter(it => EVENT.includes(it.kind)));
  const fl = filmsSorted(list);
  return (ev.length ? `<div class="grid evg">${ev.map(it => cardEvent(it, false)).join('')}</div>` : '')
    + (fl.length ? `<div class="grid books"${ev.length ? ' style="margin-top:20px"' : ''}>${fl.map(cardFilm).join('')}</div>` : '');
}
const hasTrip = it => !!(it.meta && it.meta.trip && (it.meta.trip.name || it.meta.trip.id));
function renderCulture(v){
  const all = ofTab('culture');
  if (!all.length){ v.innerHTML = '<p class="empty">첫 문화 수집은 다음 월요일 아침에 들어와요</p>'; return; }
  const base = all.filter(it => showHidden ? st(it) === 'nope' : st(it) !== 'nope');
  const live = base.filter(it => !isPast(it));
  const inScope = (it, sc) => it.kind === 'film' ? sc === 'home' : (sc === 'trip') === hasTrip(it);
  const scopeN = sc => live.filter(it => inScope(it, sc) && (cultureSub === 'all' || it.kind === cultureSub)).length;
  const kindN = k => live.filter(it => (k === 'all' || it.kind === k) && (k === 'film' || inScope(it, cultureScope))).length;
  const showScope = cultureSub !== 'film';
  const scopeSeg = showScope ? `<div class="seg scope" role="group" aria-label="어디">${[['home','서울·국내'],['trip','여행지']].map(([k, l]) => `<button class="${cultureScope === k ? 'on' : ''}" data-scope="${k}" aria-pressed="${cultureScope === k}">${l}<span class="n">${scopeN(k)}</span></button>`).join('')}</div>` : '<div></div>';
  const kindSeg = `<div class="seg" role="group" aria-label="종류">${SUBS.map(([k, l]) => `<button class="${cultureSub === k ? 'on' : ''}" data-sub="${k}" aria-pressed="${cultureSub === k}">${l}<span class="n">${kindN(k)}</span></button>`).join('')}</div>`;
  const pick = l => l.filter(it => (cultureSub === 'all' || it.kind === cultureSub) && (cultureSub === 'film' ? it.kind === 'film' : inScope(it, cultureScope)));
  const main = pick(live), past = pick(base.filter(isPast));
  const emptyMsg = showHidden ? '숨긴 것이 없어요' : (cultureScope === 'trip' && showScope ? '잡힌 여행에 맞춘 전시·공연이 아직 없어요' : '지금 볼 만한 게 없어요 · 월·목 아침에 채워져요');
  let html = `<div class="cul-ctl">${scopeSeg}${kindSeg}</div>`;
  html += main.length ? (cultureScope === 'trip' && showScope ? tripsHtml(main) : domesticHtml(main)) : `<p class="empty">${emptyMsg}</p>`;
  if (past.length){
    html += `<button class="past-btn" data-past="1">${showPast ? '지난 것 접기' : '지난 것 ' + past.length}</button>`;
    if (showPast) html += `<div class="past" style="margin-top:20px">${cultureHtml(past)}</div>`;
  }
  v.innerHTML = html;
}

function gridFor(kind, list, withHero){
  if (kind === 'culture') return cultureHtml(list);

  if (kind === 'book') return `<div class="grid books">${list.map(cardBook).join('')}</div>`;
  // 사진 있는 것 하나를 크게 (2칸), 나머지는 작게
  let ordered = list;
  if (withHero && list.length > 2){
    const hi = list.findIndex(it => safeImg(it.image)); const h = hi < 0 ? 0 : hi;
    ordered = [list[h]].concat(list.filter((_, i) => i !== h));
  }
  const fn = kind === 'city' ? cardCity : cardPlace;
  return `<div class="grid">${ordered.map((it, i) => fn(it, withHero && list.length > 2 && i === 0)).join('')}</div>`;
}

function byBatch(list){
  const g = new Map();
  list.slice().sort((a, b) => String(b.batch || '').localeCompare(String(a.batch || '')) || String(b.addedAt || '').localeCompare(String(a.addedAt || '')))
    .forEach(it => { const k = it.batch || ''; if (!g.has(k)) g.set(k, []); g.get(k).push(it); });
  return [...g.entries()];
}

function render(){
  renderHead();
  const v = document.getElementById('view');
  if (!items.length){ v.innerHTML = '<p class="empty">첫 수집은 월요일 아침에 들어와요</p>'; return; }
  if (tab === 'saved'){
    const saved = ofTab('saved');
    if (!saved.length){ v.innerHTML = '<p class="empty">★ 저장을 누르면 여기 모여요</p>'; return; }
    v.innerHTML = TABS.filter(t => t.id !== 'saved').map(t => {
      const l = saved.filter(it => t.id === 'culture' ? CULTURE.includes(it.kind) : it.kind === t.id)
        .sort((a, b) => String(b.batch || '').localeCompare(String(a.batch || '')));
      if (!l.length) return '';
      return `<section><div class="kind-h"><h2>${esc(t.label)}</h2><span class="c">${l.length}</span></div>${gridFor(t.id, l, false)}</section>`;
    }).join('');
    return;
  }
  if (tab === 'culture'){ renderCulture(v); return; }
  const list = visible(ofTab(tab));
  if (!list.length){ v.innerHTML = `<p class="empty">${showHidden ? '숨긴 것이 없어요' : '이 칸은 아직 비어 있어요 · 월·목 아침에 채워져요'}</p>`; return; }
  v.innerHTML = byBatch(list).map(([b, l]) =>
    `<section class="batch"><div class="batch-h"><h2>${esc(md(b))} 들어온 것</h2><span class="c">${l.length}</span></div>${gridFor(tab, l, !showHidden)}</section>`
  ).join('');
}

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; showHidden = false;
  try { localStorage.setItem('atelier_taste_tab', tab); } catch (e2) {}
  render(); window.scrollTo(0, 0);
});
document.getElementById('hiddenBtn').addEventListener('click', () => { showHidden = !showHidden; render(); });
document.getElementById('view').addEventListener('click', async e => {
  const sb = e.target.closest('[data-sub]'); if (sb){ cultureSub = sb.dataset.sub; try { localStorage.setItem('atelier_taste_culture_kind', cultureSub); } catch (e2) {} render(); return; }
  const sc = e.target.closest('[data-scope]'); if (sc){ cultureScope = sc.dataset.scope; try { localStorage.setItem('atelier_taste_culture_scope', cultureScope); } catch (e2) {} render(); return; }
  if (e.target.closest('[data-past]')){ showPast = !showPast; render(); return; }
  const b = e.target.closest('[data-set]'); if (!b) return;
  const it = items.find(x => x._id === b.dataset.id); if (!it) return;
  const prev = it.status;
  const next = st(it) === b.dataset.set ? 'new' : b.dataset.set;
  it.status = next; render();
  try {
    await db.collection('tasteItems').doc(it._id).update({ status: next, statusAt: firebase.firestore.FieldValue.serverTimestamp() });
    if (next === 'nope') toast('숨겼어요 · 「숨긴 것」에서 되돌릴 수 있어요');
  } catch (err) {
    it.status = prev; render(); toast('저장 못 했어요 · 다시 눌러 주세요');
  }
});

async function load(){
  try {
    const snap = await db.collection('tasteItems').get();
    items = snap.docs.map(d => Object.assign({}, d.data(), { _id: d.id }))
      .filter(it => ['place','stay','book','city'].concat(CULTURE).includes(it.kind) && it.title);
    latestBatch = items.reduce((m, it) => (it.batch || '') > m ? it.batch : m, '');
    render();
  } catch (err) {
    document.getElementById('view').innerHTML = '<p class="empty">불러오지 못했어요 · 새로고침해 주세요</p>';
  }
}

renderHead();
auth.onAuthStateChanged(user => {
  if (!user || user.email !== ALLOWED_EMAIL){
    document.getElementById('view').innerHTML = '<p class="empty">메인 화면에서 로그인하면 보여요</p>';
    return;
  }
  load();
});
</script>
</body>
</html>
