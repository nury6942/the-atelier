<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tutor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0">
<style>
  /* ═══════════════════════════════════════════════════════════
     AI TUTOR — Gemini Live 로 하는 영어 화상 회화 (1단계: 대화 화면)
     규칙: 바탕 흰색 · 모든 칸 직각 · 포인트 코발트 · 글꼴 Pretendard 하나
     ═══════════════════════════════════════════════════════════ */
  :root{
    --accent:#1F4BD8; --accent-soft:rgba(31,75,216,.08);
    --ink:#0b0b0c; --mut:rgba(0,0,0,.58); --dim:rgba(0,0,0,.38);
    --line:rgba(0,0,0,.1); --panel:#fafafa; --paper:#fff; --danger:#d4351c;
  }
  *{box-sizing:border-box;border-radius:0}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
    -webkit-font-smoothing:antialiased;font-size:14px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  input,select{font:inherit;color:inherit}
  .ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:20px;line-height:1;
    letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;
    font-variation-settings:'opsz' 20,'wght' 400,'FILL' 0}

  .app{display:grid;grid-template-columns:248px 1fr;height:100vh}

  /* ── 사이드바 ── */
  .side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;font-weight:800;font-size:16px;letter-spacing:-.01em}
  .brand .mark{width:26px;height:26px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
  .nav{padding:4px 10px 12px;border-bottom:1px solid var(--line)}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;color:var(--mut);font-weight:500;text-align:left}
  .nav button:hover{background:rgba(0,0,0,.04);color:var(--ink)}
  .nav button.on{color:var(--ink);font-weight:700}
  .nav button[disabled]{opacity:.45;cursor:default}
  .nav button[disabled]:hover{background:none;color:var(--mut)}
  .nav .soon{margin-left:auto;font-size:10px;letter-spacing:.08em;color:var(--dim);font-weight:600}
  .hist-h{padding:16px 20px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .hist{flex:1;overflow-y:auto;padding:0 10px 16px}
  .hist button{display:block;width:100%;text-align:left;padding:9px 10px}
  .hist button:hover{background:rgba(0,0,0,.04)}
  .hist .t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist .m{font-size:11.5px;color:var(--dim);margin-top:2px}
  .hist .empty{padding:8px 10px;color:var(--dim);font-size:12.5px;line-height:1.5}

  /* ── 메인 ── */
  .main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:14px 20px;min-height:58px}
  .pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:7px 10px;background:#fff;font-size:12.5px}
  .pill select{border:0;background:transparent;outline:none;font-weight:600;cursor:pointer}
  .pill .lbl{color:var(--dim);font-size:11px;letter-spacing:.06em}

  /* 홈 화면 */
  .home{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px 48px}
  .avatar{width:96px;height:96px;flex:none}
  .home .who{font-size:12px;color:var(--dim);margin-top:6px}
  .home h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:22px 0 22px;text-align:center}
  .modes{display:flex;gap:0;border:1px solid var(--line);margin-bottom:14px}
  .modes button{padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--mut);border-right:1px solid var(--line)}
  .modes button:last-child{border-right:0}
  .modes button.on{background:var(--ink);color:#fff}
  .topic{display:flex;align-items:center;gap:10px;width:min(560px,100%);border:1px solid var(--line);padding:12px 14px;background:#fff}
  .topic:focus-within{border-color:var(--accent)}
  .topic input{flex:1;border:0;outline:none;font-size:14px;background:transparent}
  .topic .ms{color:var(--dim)}
  .sugg-h{display:flex;justify-content:space-between;width:min(560px,100%);margin:18px 0 8px;font-size:11.5px;color:var(--dim)}
  .sugg-h button{color:var(--dim);display:flex;align-items:center;gap:4px}
  .sugg-h button:hover{color:var(--ink)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);width:min(560px,100%);border-left:1px solid var(--line);border-top:1px solid var(--line)}
  .cards button{text-align:left;padding:14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:86px;display:flex;flex-direction:column;gap:8px;background:#fff}
  .cards button:hover{background:var(--accent-soft)}
  .cards button.on{outline:2px solid var(--accent);outline-offset:-2px}
  .cards .k{font-size:10.5px;letter-spacing:.1em;color:var(--dim);font-weight:700;text-transform:uppercase}
  .cards .v{font-size:13px;font-weight:600;line-height:1.4}
  .start{flex:none;margin-top:36px;width:84px;height:84px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    border-radius:0!important;transition:transform .15s}
  .start:hover{transform:scale(1.04)}
  .start .ms{font-size:28px}
  .start span:last-child{font-size:11px;font-weight:600}
  .hint{margin-top:22px;font-size:12px;color:var(--dim);border:1px solid var(--line);padding:7px 12px}

  /* 토큰 입력 */
  .auth{width:min(560px,100%);border:1px solid var(--line);background:var(--panel);padding:14px;margin-bottom:22px;display:none}
  .auth p{margin:0 0 10px;font-size:12.5px;color:var(--mut);line-height:1.55}
  .auth .row{display:flex;gap:8px}
  .auth input{flex:1;border:1px solid var(--line);padding:9px 10px;outline:none;background:#fff}
  .btn{padding:9px 14px;font-weight:700;font-size:12.5px;border:1px solid var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

  /* 통화 화면 */
  .call{flex:1;display:none;grid-template-columns:1fr 360px;min-height:0}
  .stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;min-height:0;background:#fff}
  .stage .tutor{display:flex;flex-direction:column;align-items:center}
  .ring{width:168px;height:168px;border-radius:0!important;display:grid;place-items:center;position:relative}
  .ring::before{content:'';position:absolute;inset:0;border-radius:0;border:2px solid var(--accent);opacity:0;transform:scale(.92);transition:opacity .2s}
  .ring.talking::before{opacity:1;animation:pulse 1.1s ease-in-out infinite}
  .ring.listening::before{opacity:.35;border-color:var(--ink)}
  @keyframes pulse{0%,100%{transform:scale(.94)}50%{transform:scale(1.04)}}
  .ring .avatar{width:132px;height:132px}
  .state{margin-top:16px;font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:8px}
  .state .dot{width:7px;height:7px;background:var(--dim);border-radius:0!important}
  .state.live .dot{background:#18a957}
  .state.err{color:var(--danger)}
  .state.err .dot{background:var(--danger)}
  .topic-tag{margin-top:10px;font-size:12px;color:var(--dim);max-width:420px;text-align:center}
  .selfview{position:absolute;right:20px;top:20px;width:220px;aspect-ratio:4/3;background:#000;border:1px solid var(--line);display:none;overflow:hidden}
  .selfview video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .selfview.screen video{object-fit:contain;transform:none}
  .selfview .tag{position:absolute;left:0;top:0;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;padding:3px 7px;letter-spacing:.06em}
  .controls{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
  .ctl{width:52px;height:52px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;border-radius:0!important}
  .ctl:hover{background:rgba(0,0,0,.04)}
  .ctl.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .ctl.off{background:var(--ink);border-color:var(--ink);color:#fff}
  .ctl.end{background:var(--danger);border-color:var(--danger);color:#fff;width:64px}
  .meter{position:absolute;left:24px;top:20px;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
  .timer{font-size:12px;color:var(--dim);letter-spacing:.04em}
  .cost{border:1px solid var(--line);padding:8px 10px;min-width:132px}
  .cost .k{font-size:10px;letter-spacing:.12em;color:var(--dim);font-weight:700}
  .cost .won{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
  .cost .usd{font-size:11px;color:var(--dim);margin-top:1px}
  .spend{border-top:1px solid var(--line);padding:14px 20px 16px;font-variant-numeric:tabular-nums}
  .spend .k{font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:700;text-transform:uppercase}
  .spend .v{font-size:18px;font-weight:800;margin-top:4px}
  .spend .s{font-size:11.5px;color:var(--dim);margin-top:2px}

  /* 자막 패널 */
  .captions{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  .captions .h{padding:16px 18px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;display:flex;justify-content:space-between}
  .captions .h button{color:var(--dim);letter-spacing:.06em}
  .lines{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
  .ln .who{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
  .ln.tutor .who{color:var(--accent)}
  .ln .tx{font-size:14px;line-height:1.55}
  .ln.me .tx{color:var(--mut)}
  .say{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
  .say input{flex:1;border:1px solid var(--line);padding:9px 10px;outline:none}
  .say input:focus{border-color:var(--accent)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;font-size:12.5px;display:none;z-index:20;max-width:90vw}

  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .side{display:none}
    .call{grid-template-columns:1fr;grid-template-rows:1fr 38vh}
    .captions{border-left:0;border-top:1px solid var(--line)}
    .selfview{width:132px;right:12px;top:12px}
    .cards{grid-template-columns:1fr}
    .cards button{min-height:0}
    .home h1{font-size:21px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark">T</span>Tutor</div>
    <nav class="nav">
      <button class="on" onclick="goHome()"><span class="ms">add</span>새 대화</button>
      <button disabled><span class="ms">person</span>내 학습 프로필<span class="soon">곧</span></button>
      <button disabled><span class="ms">bookmark</span>저장한 표현<span class="soon">곧</span></button>
      <button disabled><span class="ms">replay</span>복습<span class="soon">곧</span></button>
    </nav>
    <div class="hist-h">최근 대화</div>
    <div class="hist" id="hist"></div>
    <div class="spend"><div class="k">This Month</div><div class="v" id="spendMonth">₩0</div><div class="s" id="spendNote">이 브라우저에서 한 대화 기준 · 추정</div></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <label class="pill"><span class="lbl">MODEL</span>
        <select id="model">
          <option value="gemini-3.8-live">Gemini 3.8 Live</option>
          <option value="gemini-3.1-flash-live-preview">Gemini 3.1 Flash Live</option>
        </select>
      </label>
      <label class="pill"><span class="lbl">VOICE</span>
        <select id="voice">
          <option value="Aoede">Aoede · 차분</option>
          <option value="Kore">Kore · 또렷</option>
          <option value="Puck">Puck · 밝음</option>
          <option value="Charon">Charon · 낮음</option>
        </select>
      </label>
    </div>

    <!-- 홈 -->
    <section class="home" id="home">
      <div class="auth" id="auth">
        <p>처음 한 번만 필요해요. 설정 → AI 코치 설정에 넣은 <b>ATELIER 토큰</b>을 붙여 넣어 주세요. 같은 브라우저라면 자동으로 채워져요.</p>
        <div class="row"><input id="authInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-1p-ignore placeholder="ATELIER_AUTH_TOKEN"><button class="btn primary" onclick="saveAuth()">저장</button></div>
      </div>
      <svg class="avatar" id="avatarTpl" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="60" fill="#eef1fb"/>
        <path d="M24 120c2-22 17-34 36-34s34 12 36 34z" fill="#1F4BD8"/>
        <path d="M50 84h20v10a10 10 0 0 1-20 0z" fill="#f2c9a8"/>
        <ellipse cx="60" cy="58" rx="22" ry="25" fill="#f6d5ba"/>
        <path d="M37 54c0-17 10-27 24-27 15 0 24 10 23 27-4-9-12-13-23-13-11 0-19 4-24 13z" fill="#2b211c"/>
        <circle cx="51" cy="60" r="7.5" fill="none" stroke="#0b0b0c" stroke-width="2"/>
        <circle cx="69" cy="60" r="7.5" fill="none" stroke="#0b0b0c" stroke-width="2"/>
        <path d="M58.5 60h3" stroke="#0b0b0c" stroke-width="2"/>
        <circle cx="51" cy="60" r="1.8" fill="#0b0b0c"/><circle cx="69" cy="60" r="1.8" fill="#0b0b0c"/>
        <path d="M54 72q6 4 12 0" fill="none" stroke="#a35a3c" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="who">Your tutor · Emma</div>
      <h1>무엇에 대해 영어로 대화해볼까요?</h1>
      <div class="modes" id="modes">
        <button class="on" data-mode="free">프리토킹</button>
        <button data-mode="interview">면접 연습</button>
        <button data-mode="portfolio">포트폴리오 설명</button>
      </div>
      <label class="topic"><span class="ms">edit</span><input id="topicInput" placeholder="하고 싶은 이야기를 적거나, 아래에서 골라도 돼요 (비워도 OK)"></label>
      <div class="sugg-h"><span>이런 주제는 어때요?</span><button onclick="shuffleTopics()"><span class="ms" style="font-size:16px">refresh</span>다른 주제</button></div>
      <div class="cards" id="cards"></div>
      <button class="start" onclick="startCall()" aria-label="대화 시작"><span class="ms">mic</span><span>시작하기</span></button>
      <div class="hint">카메라나 화면을 켜면 튜터가 보면서 이야기해요</div>
    </section>

    <!-- 통화 -->
    <section class="call" id="call">
      <div class="stage">
        <div class="meter">
          <div class="timer" id="timer">00:00</div>
          <div class="cost"><div class="k">THIS CALL</div><div class="won" id="costWon">₩0</div><div class="usd" id="costUsd">$0.000 · 추정</div></div>
        </div>
        <div class="selfview" id="selfview"><span class="tag" id="selftag">CAMERA</span><video id="selfvideo" autoplay muted playsinline></video></div>
        <div class="tutor">
          <div class="ring" id="ring"></div>
          <div class="state" id="state"><span class="dot"></span><span id="stateText">연결 중…</span></div>
          <div class="topic-tag" id="topicTag"></div>
        </div>
        <div class="controls">
          <button class="ctl" id="btnMic" onclick="toggleMic()" title="마이크"><span class="ms">mic</span></button>
          <button class="ctl" id="btnCam" onclick="toggleCam()" title="카메라"><span class="ms">videocam_off</span></button>
          <button class="ctl" id="btnScreen" onclick="toggleScreen()" title="화면 공유"><span class="ms">screen_share</span></button>
          <button class="ctl end" onclick="endCall()" title="끝내기"><span class="ms">call_end</span></button>
        </div>
      </div>
      <div class="captions">
        <div class="h"><span>Live captions</span><button onclick="toggleCaptions()" id="capBtn">숨기기</button></div>
        <div class="lines" id="lines"></div>
        <form class="say" onsubmit="sendText(event)"><input id="sayInput" placeholder="말 대신 글로 보내기 (단어가 막힐 때)"><button class="btn" type="submit">보내기</button></form>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  설정
// ═══════════════════════════════════════════════════════════
var TOKEN_API = 'https://us-central1-the-atelier-99b8c.cloudfunctions.net/tutorToken';
var WS_URL = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token=';
var HIST_KEY = 'atelier_tutor_history_v1';   // 1단계는 이 브라우저에만 저장. 2단계에서 Firestore 로 옮김
var PREF_KEY = 'atelier_tutor_prefs_v1';

var TOPICS = {
  free: [
    ['요즘', '요즘 빠져 있는 것'], ['취미', '새로 배워보고 싶은 취미'], ['여행', '다시 가고 싶은 여행지'],
    ['일', '이번 주 회사에서 있었던 일'], ['음식', '최근에 먹은 제일 맛있는 것'], ['영화·책', '요즘 보거나 읽는 것'],
    ['패션', '이번 시즌 눈에 띈 트렌드'], ['주말', '이번 주말 계획'], ['생각', '요즘 자주 하는 고민'],
    ['도시', '살아보고 싶은 도시'], ['습관', '바꾸고 싶은 습관 하나'], ['추억', '어릴 때 좋아했던 것']
  ],
  interview: [
    ['자기소개', 'Tell me about yourself'], ['동기', '왜 해외에서 일하고 싶은지'], ['강점', '디자이너로서의 강점과 약점'],
    ['협업', '의견이 부딪혔던 프로젝트'], ['실패', '실패에서 배운 것'], ['포부', '5년 뒤의 나'],
    ['브랜드', '이 브랜드에 지원한 이유'], ['과정', '컬렉션을 기획하는 방식'], ['압박', '마감에 쫓겼던 경험']

    ['컨셉', '컬렉션 컨셉 설명하기'], ['피드백', '받은 피드백과 수정한 점'], ['타깃', '이 옷을 입을 사람'],
    ['화면공유', '화면에 띄운 작업 보여주기'], ['비교', '이전 시즌과 달라진 점'], ['기술', '패턴·디테일 설명하기']
  ]
};

var MODE_BRIEF = {
  free: 'Free conversation. Be a curious friend: ask follow-up questions about her life, opinions and stories.',
  interview: 'Mock job interview for a fashion designer role at a European/Canadian/Australian brand. Play a warm but realistic interviewer: ask one question at a time, follow up on vague answers, and at natural pauses give brief tips on how a native speaker would phrase her answer more strongly.',
  portfolio: 'Portfolio walkthrough practice. She may share her screen or hold work up to the camera. Ask her to explain concept, process, materials and decisions as she would to a hiring manager. Comment specifically on what you can see.'
};

function systemPrompt(mode, topic){
  return [
    'You are Emma, a friendly native English tutor (neutral British/International accent) having a relaxed 1:1 video call with Nuri.',
    'About Nuri: Korean fashion designer, upper-intermediate (B2) aiming for C1, preparing to work abroad (EU / Canada / Australia). She has had a long-time human tutor, so treat this as relaxed extra speaking practice, not a test. She finds pressure-heavy lessons draining — keep it light and warm.',
    'Session type: ' + MODE_BRIEF[mode],
    topic ? ('Starting topic: "' + topic + '". Open with a natural question about it.') : 'No topic chosen: greet her and ask a light opener about her day.',
    'How to talk:',
    '- Speak naturally at a moderate pace. Keep your turns short (1–3 sentences) so she does most of the talking.',
    '- Ask open follow-up questions. Show real interest.',
    '- Corrections: do NOT interrupt her. When she makes a meaningful mistake or sounds unnatural, recast it casually in your reply ("Oh, so you\'ve been working on it since March — nice!"). At most one explicit tip every few turns: "Quick tip: native speakers would say …".',
    '- If she gets stuck or uses a Korean word, help her find the English phrase, then continue.',
    '- If she shares her camera or screen, refer to what you actually see when relevant. Never pretend to see something you cannot.',
    '- Always reply in English, unless she explicitly asks for a Korean explanation of a word.'
  ].join('\n');
}

// ═══════════════════════════════════════════════════════════
//  비용 — 매 턴 끝에 Google 이 보내는 usageMetadata(토큰 수)로 계산
//  Live API 는 턴마다 지금까지의 대화 전체를 다시 읽어서, 대화가 길어질수록 한 턴이 조금씩 비싸진다.
//  단가: ai.google.dev/gemini-api/docs/pricing (2026-10-18 확인, USD / 1M 토큰)
// ═══════════════════════════════════════════════════════════
var PRICES = {
  'gemini-3.8-live':               { TEXT: 0.75, AUDIO: 3.00, IMAGE: 1.00, VIDEO: 1.00, outTEXT: 4.50, outAUDIO: 12.00 },
  'gemini-3.1-flash-live-preview': { TEXT: 0.75, AUDIO: 3.00, IMAGE: 1.00, VIDEO: 1.00, outTEXT: 4.50, outAUDIO: 12.00 }
};
var KRW_PER_USD = 1400;   // 환율 추정치. 실제 청구액은 AI Studio 에서 확인

function usageCost(u, model){
  var P = PRICES[model] || PRICES['gemini-3.8-live'];
  var usd = 0, seen = 0;
  (u.promptTokensDetails || []).forEach(function(d){
    usd += d.tokenCount * (P[d.modality] != null ? P[d.modality] : P.AUDIO); seen += d.tokenCount;
  });
  usd += Math.max(0, (u.promptTokenCount || 0) - seen) * P.TEXT;            // 내역에 안 잡힌 나머지(캐시 등)는 글자 단가로
  seen = 0;
  (u.responseTokensDetails || []).forEach(function(d){
    usd += d.tokenCount * (d.modality === 'TEXT' ? P.outTEXT : P.outAUDIO); seen += d.tokenCount;
  });
  usd += Math.max(0, (u.responseTokenCount || 0) - seen) * P.outAUDIO;
  usd += (u.thoughtsTokenCount || 0) * P.outTEXT;                           // 생각 토큰은 글자 출력 단가
  return usd / 1e6;
}
function fmtWon(usd){ return '₩' + Math.round(usd * KRW_PER_USD).toLocaleString('ko-KR'); }
function showCost(usd){
  $('costWon').textContent = fmtWon(usd);
  $('costUsd').textContent = '$' + usd.toFixed(3) + ' · 추정';
}
function renderSpend(){
  var now = new Date(), usd = 0, n = 0;
  loadHist().forEach(function(h){
    var d = new Date(h.at);
    if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && h.usd){ usd += h.usd; n++; }
  });
  if (sess.active && sess.usd) usd += sess.usd;
  $('spendMonth').textContent = fmtWon(usd);
  $('spendNote').textContent = (now.getMonth() + 1) + '월 · 대화 ' + n + '번 · $' + usd.toFixed(2) + ' · 추정';
}

var cur = { who: null, el: null };
function addLine(who, text){
  var d = document.createElement('div');
  d.className = 'ln ' + who;
  d.innerHTML = '<div class="who"></div><div class="tx"></div>';
  d.querySelector('.who').textContent = who === 'tutor' ? 'Emma' : 'Me';
  d.querySelector('.tx').textContent = text;
  $('lines').appendChild(d);
  $('lines').scrollTop = $('lines').scrollHeight;
  return d;
}
function appendCaption(who, chunk){
  if (!chunk) return;
  if (cur.who !== who || !cur.el){
    cur = { who: who, el: addLine(who, '') };
    sess.lines.push({ who: who, text: '' });
  }
  var last = sess.lines[sess.lines.length - 1];
  last.text += chunk;
  cur.el.querySelector('.tx').textContent = last.text.replace(/\s+/g, ' ').trim();
  $('lines').scrollTop = $('lines').scrollHeight;
}
function breakCaption(){ cur = { who: null, el: null }; }
function toggleCaptions(){
  var hidden = $('lines').style.visibility === 'hidden';
  $('lines').style.visibility = hidden ? 'visible' : 'hidden';
  $('capBtn').textContent = hidden ? '숨기기' : '보이기';
}

// ═══════════════════════════════════════════════════════════
//  오디오 — 마이크(16kHz PCM) 보내기 / 튜터 목소리(24kHz PCM) 재생
// ═══════════════════════════════════════════════════════════
var WORKLET = "class P extends AudioWorkletProcessor{constructor(){super();this.b=new Int16Array(1600);this.i=0}" +
  "process(inp){var c=inp[0]&&inp[0][0];if(!c)return true;for(var k=0;k<c.length;k++){var s=Math.max(-1,Math.min(1,c[k]));" +
  "this.b[this.i++]=s<0?s*32768:s*32767;if(this.i===this.b.length){this.port.postMessage(this.b.buffer.slice(0));this.i=0}}return true}}" +
  "registerProcessor('pcm16',P)";

function b64FromBuf(buf){
  var bytes = new Uint8Array(buf), s = '';
  for (var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

async function startMic(){
  sess.inCtx = new AudioContext({ sampleRate: 16000 });
  var url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
  await sess.inCtx.audioWorklet.addModule(url);
  sess.micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  var src = sess.inCtx.createMediaStreamSource(sess.micStream);
  sess.worklet = new AudioWorkletNode(sess.inCtx, 'pcm16');
  sess.worklet.port.onmessage = function(e){
    if (!sess.micOn || !sess.ready) return;
    send({ realtimeInput: { audio: { data: b64FromBuf(e.data), mimeType: 'audio/pcm;rate=16000' } } });
  };
  src.connect(sess.worklet);
}

function playPcm(b64){
  var ctx = sess.outCtx;
  var bin = atob(b64), n = bin.length >> 1, f = new Float32Array(n);
  for (var i = 0; i < n; i++){
    var v = bin.charCodeAt(2*i) | (bin.charCodeAt(2*i+1) << 8);
    f[i] = (v >= 32768 ? v - 65536 : v) / 32768;
  }
  var buf = ctx.createBuffer(1, n, 24000); buf.copyToChannel(f, 0);
  var s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination);
  var t = Math.max(ctx.currentTime + 0.02, sess.playAt);
  s.start(t); sess.playAt = t + buf.duration;
  sess.sources.push(s);
  s.onended = function(){
    sess.sources = sess.sources.filter(function(x){ return x !== s; });
    if (!sess.sources.length) setTalking(false);
  };
  setTalking(true);
}
function stopPlayback(){
  sess.sources.forEach(function(s){ try { s.stop(); } catch(e){} });
  sess.sources = []; sess.playAt = 0; setTalking(false);
}
function setTalking(on){
  $('ring').classList.toggle('talking', on);
  $('ring').classList.toggle('listening', !on && sess.active);
}

// ═══════════════════════════════════════════════════════════
//  카메라 · 화면 공유 — 1초에 한 장씩 JPEG 로 보냄
// ═══════════════════════════════════════════════════════════
function stopVideo(){
  if (sess.videoTimer){ clearInterval(sess.videoTimer); sess.videoTimer = null; }
  if (sess.videoStream){ sess.videoStream.getTracks().forEach(function(t){ t.stop(); }); sess.videoStream = null; }
  sess.videoKind = null;
  $('selfview').style.display = 'none';
  $('btnCam').classList.remove('on'); $('btnCam').querySelector('.ms').textContent = 'videocam_off';
  $('btnScreen').classList.remove('on');
}
async function startVideo(kind){
  stopVideo();
  try {
    sess.videoStream = kind === 'screen'
      ? await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 5 }, audio: false })
      : await navigator.mediaDevices.getUserMedia({ video: { width: 960, height: 720 } });
  } catch(e){ toast(kind === 'screen' ? '화면 공유를 취소했어요' : '카메라를 켤 수 없어요'); return; }
  sess.videoKind = kind;
  var v = $('selfvideo'); v.srcObject = sess.videoStream;
  $('selfview').style.display = 'block';
  $('selfview').classList.toggle('screen', kind === 'screen');
  $('selftag').textContent = kind === 'screen' ? 'SCREEN' : 'CAMERA';
  if (kind === 'screen') $('btnScreen').classList.add('on');
  else { $('btnCam').classList.add('on'); $('btnCam').querySelector('.ms').textContent = 'videocam'; }
  sess.videoStream.getVideoTracks()[0].onended = stopVideo;   // 브라우저 '공유 중지' 버튼
  var canvas = document.createElement('canvas');
  sess.videoTimer = setInterval(function(){
    if (!sess.ready || !v.videoWidth) return;
    var scale = Math.min(1, 1024 / Math.max(v.videoWidth, v.videoHeight));
    canvas.width = Math.round(v.videoWidth * scale); canvas.height = Math.round(v.videoHeight * scale);
    canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height);
    var data = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
    send({ realtimeInput: { video: { data: data, mimeType: 'image/jpeg' } } });
  }, 1000);
}
function toggleCam(){ sess.videoKind === 'camera' ? stopVideo() : startVideo('camera'); }
function toggleScreen(){ sess.videoKind === 'screen' ? stopVideo() : startVideo('screen'); }
function toggleMic(){
  sess.micOn = !sess.micOn;
  $('btnMic').classList.toggle('off', !sess.micOn);
  $('btnMic').querySelector('.ms').textContent = sess.micOn ? 'mic' : 'mic_off';
  if (!sess.micOn && sess.ready) send({ realtimeInput: { audioStreamEnd: true } });
}

// ═══════════════════════════════════════════════════════════
//  Gemini Live 연결
//  - 토큰: tutorToken 함수가 30분짜리 1회용 토큰을 줌 (API 키는 서버에만)
//  - 연결은 ~10분마다 끊기므로 sessionResumption 핸들로 새 토큰 받아 이어 붙임
// ═══════════════════════════════════════════════════════════
var sess = { active: false };

async function fetchToken(){
  var r = await fetch(TOKEN_API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Atelier-Token': getAuth() }, body: '{}' });
  if (r.status === 401) throw new Error('AUTH');
  var j = await r.json().catch(function(){ return {}; });
  if (!r.ok || !j.token) throw new Error(j.message || ('토큰 발급 실패 (' + r.status + ')'));
  return j.token;
}

function send(obj){ if (sess.ws && sess.ws.readyState === 1) sess.ws.send(JSON.stringify(obj)); }

async function connect(){
  var token = await fetchToken();
  var ws = new WebSocket(WS_URL + encodeURIComponent(token));
  sess.ws = ws; sess.ready = false;
  ws.onopen = function(){
    var setup = {
      model: 'models/' + sess.model,
      generationConfig: {
        responseModalities: ['AUDIO'],
        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: sess.voice } } }
      },
      systemInstruction: { parts: [{ text: systemPrompt(sess.mode, sess.topic) }] },
      inputAudioTranscription: {},
      outputAudioTranscription: {},
      contextWindowCompression: { slidingWindow: {} },
      sessionResumption: sess.resumeHandle ? { handle: sess.resumeHandle } : {}
    };
    send({ setup: setup });
  };
  ws.onmessage = async function(ev){
    var raw = typeof ev.data === 'string' ? ev.data : await ev.data.text();
    var m; try { m = JSON.parse(raw); } catch(e){ return; }
    onServer(m);
  };
  ws.onclose = function(ev){
    if (ws !== sess.ws) return;                 // 재연결로 바뀐 옛 소켓
    sess.ready = false;
    if (!sess.active) return;
    if (sess.resumeHandle && sess.reconnects < 20){
      sess.reconnects++; setState('다시 연결 중…', '');
      connect().catch(fail);
    } else {
      fail(new Error(ev.reason || ('연결이 끊겼어요 (' + ev.code + ')')));
    }
  };
}

function onServer(m){
  if (m.usageMetadata){
    sess.usd += usageCost(m.usageMetadata, sess.model);
    showCost(sess.usd); renderSpend();
  }
  if (m.setupComplete){
    sess.ready = true;
    setState('대화 중', 'live');
    if (!sess.greeted){ sess.greeted = true; send({ realtimeInput: { text: 'Hi Emma!' } }); }
    return;
  }
  if (m.sessionResumptionUpdate && m.sessionResumptionUpdate.resumable && m.sessionResumptionUpdate.newHandle){
    sess.resumeHandle = m.sessionResumptionUpdate.newHandle;
  }
  if (m.goAway){ try { sess.ws.close(); } catch(e){} return; }   // onclose 에서 이어 붙임
  var sc = m.serverContent; if (!sc) return;
  if (sc.interrupted){ stopPlayback(); breakCaption(); }
  if (sc.inputTranscription && sc.inputTranscription.text) appendCaption('me', sc.inputTranscription.text);
  if (sc.outputTranscription && sc.outputTranscription.text) appendCaption('tutor', sc.outputTranscription.text);
  if (sc.modelTurn && sc.modelTurn.parts){
    sc.modelTurn.parts.forEach(function(p){
      if (p.inlineData && p.inlineData.data && /audio/.test(p.inlineData.mimeType || 'audio')) playPcm(p.inlineData.data);
    });
  }
  if (sc.turnComplete) breakCaption();
}

async function startCall(){
  if (!getAuth()){ $('auth').style.display = 'block'; $('authInput').focus(); return; }
  sess = {
    active: true, ready: false, greeted: false, micOn: true, reconnects: 0, resumeHandle: null,
    model: $('model').value, voice: $('voice').value, mode: state.mode, topic: $('topicInput').value.trim(),
    lines: [], sources: [], playAt: 0, startedAt: Date.now(), usd: 0
  };
  showCost(0);
  breakCaption();
  $('home').style.display = 'none'; $('call').style.display = 'grid';
  document.querySelector('.controls').style.display = 'flex';
  document.querySelector('.say').style.display = 'flex';
  $('lines').innerHTML = ''; $('lines').style.visibility = 'visible'; $('capBtn').textContent = '숨기기';
  $('ring').innerHTML = $('avatarTpl').outerHTML.replace('id="avatarTpl"', '');
  $('topicTag').textContent = sess.topic || MODE_LABEL[sess.mode];
  $('btnMic').classList.remove('off'); $('btnMic').querySelector('.ms').textContent = 'mic';
  setState('연결 중…', '');
  sess.timer = setInterval(function(){ $('timer').textContent = fmtTime((Date.now() - sess.startedAt) / 1000); }, 1000);
  try {
    sess.outCtx = new AudioContext({ sampleRate: 24000 });
    await startMic();
    await connect();
  } catch(e){ fail(e); }
}

function endCall(){
  if (!sess.active) return;
  sess.active = false; sess.ready = false;
  clearInterval(sess.timer);
  try { sess.ws && sess.ws.close(); } catch(e){}
  stopVideo(); stopPlayback();
  if (sess.micStream) sess.micStream.getTracks().forEach(function(t){ t.stop(); });
  try { sess.inCtx && sess.inCtx.close(); } catch(e){}
  try { sess.outCtx && sess.outCtx.close(); } catch(e){}
  $('ring').classList.remove('listening', 'talking');
  var lines = sess.lines.filter(function(l){ return l.text.trim(); }).map(function(l){ return { who: l.who, text: l.text.replace(/\s+/g, ' ').trim() }; });
  var sec = Math.round((Date.now() - sess.startedAt) / 1000);
  if (lines.length || sess.usd){
    var list = loadHist();
    list.unshift({ at: sess.startedAt, sec: sec, mode: sess.mode, topic: sess.topic, model: sess.model, usd: sess.usd, lines: lines });
    saveHist(list); renderHist();
  }
  renderSpend();
  setState('대화를 마쳤어요 · ' + fmtTime(sec) + ' · ' + fmtWon(sess.usd), '');
  document.querySelector('.controls').style.display = 'none';
  document.querySelector('.say').style.display = 'none';
}

function fail(e){
  var msg = e && e.message === 'AUTH' ? 'ATELIER 토큰이 맞지 않아요. 다시 넣어 주세요.'
    : e && e.name === 'NotAllowedError' ? '마이크 권한이 필요해요. 주소창 왼쪽에서 허용해 주세요.'
    : e && /credits are depleted|billing|quota/i.test(e.message) ? 'Gemini API 크레딧이 없어요. AI Studio(ai.studio/projects)에서 결제를 연결하거나 충전해 주세요.'
    : e && e.message === 'Failed to fetch' ? '튜터 서버(tutorToken)에 닿지 못했어요. 함수가 배포됐는지 확인해 주세요.'
    : (e && e.message) || '연결하지 못했어요';
  console.error('[tutor]', e);
  endCall();
  setState(msg, 'err');
  if (e && e.message === 'AUTH'){ try { localStorage.removeItem('atelier_coach_auth_token'); } catch(_){} }
}

function sendText(ev){
  ev.preventDefault();
  var v = $('sayInput').value.trim(); if (!v || !sess.ready) return;
  breakCaption(); appendCaption('me', v); breakCaption();
  send({ realtimeInput: { text: v } });
  $('sayInput').value = '';
}

function setState(text, cls){ $('state').className = 'state ' + (cls || ''); $('stateText').textContent = text; }
function fmtTime(s){ s = Math.max(0, Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
var toastT;
function toast(t){ var el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(function(){ el.style.display = 'none'; }, 2600); }
