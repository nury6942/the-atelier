<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Postype Market</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 아뜰리에 정본(DESIGN.md): 흰 바탕·직각·코발트 하나·Pretendard·그림자 없음·연회색 글자 없음
     데이터: 아이맥 scripts/postype-market/ (Aside 로 포스타입 '나페스' 검색 1년치) → Firestore postypeMarket/latest_* */
  :root{
    --accent:#1F4BD8; --accent-ink:#1A3FB5; --accent-soft:#EEF2FD; --sel:#F3F6FE;
    --ink:#16161A; --ink2:#5B5B66; --mut:#475569;
    --line:#ECECF0; --line2:#DCDCE3; --surface:#F8F8FA;
    --green:#15803D; --red:#DC2626;
    --bar2:#9DB0EE; --bar3:#C9D4F5;
  }
  *{box-sizing:border-box;border-radius:0}
  html,body{margin:0;background:#fff;color:var(--ink)}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden;font-size:14px;line-height:1.55}
  a{color:inherit;text-decoration:none}
  a.lnk:hover{color:var(--accent);text-decoration:underline}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
  h1,h2,h3{text-wrap:balance;margin:0}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 96px}

  .mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
  .mast h1{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .mast .feed{font-size:12.5px;font-weight:500;color:var(--ink2)}
  .mast .feed b{font-weight:700;color:var(--ink)}

  .tabsrow{display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);margin-top:20px}
  .tabs{display:flex;gap:24px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:10px 0 12px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--ink)}

  .seg{display:inline-flex;background:var(--surface);padding:2px;gap:2px}
  .seg button{padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2);border:1px solid transparent}
  .seg button.on{background:#fff;color:var(--ink);border-color:var(--ink)}

  .sec{margin-top:32px}
  .sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .sech h2{font-size:16px;font-weight:700}
  .sech p{margin:0;font-size:12.5px;color:var(--mut)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-top:24px}
  .kpi{padding:16px 18px;border-left:1px solid var(--line)}
  .kpi:first-child{border-left:0}
  .kpi .l{font-size:12.5px;font-weight:600;color:var(--ink2)}
  .kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .kpi .s{font-size:12px;color:var(--mut);margin-top:2px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .card{border:1px solid var(--line);padding:18px}

  /* 가로 막대 목록 */
  .bars{display:flex;flex-direction:column;gap:2px}
  .bar{display:grid;grid-template-columns:22px minmax(92px,150px) 1fr 86px 58px;align-items:center;gap:10px;padding:5px 0;font-size:13px}
  .bar .rk{color:var(--ink2);font-weight:600}
  .bar .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .nm small{display:block;font-size:11.5px;font-weight:500;color:var(--ink2)}
  .bar .tr{height:14px;background:var(--surface);position:relative}
  .bar .fl{position:absolute;inset:0 auto 0 0;background:var(--accent)}
  .bar .fl.mine{background:var(--ink)}
  .bar .vv{text-align:right;font-weight:700}
  .bar .gw{text-align:right;font-size:12px;font-weight:700}
  .up{color:var(--green)} .dn{color:var(--red)} .flat{color:var(--ink2)}

  /* 표 */
  .tblwrap{overflow-x:auto;border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{font-size:12px;font-weight:600;color:var(--ink2);background:#fff;position:sticky;top:0;cursor:pointer;user-select:none}
  th.on{color:var(--ink)}
  th.on::after{content:' ↓'}
  th.on.asc::after{content:' ↑'}
  th:first-child,td:first-child,th.l,td.l{text-align:left}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--surface)}
  tbody tr.mine{background:var(--sel)}
  tbody tr.open{background:var(--sel)}
  td .sub{display:block;font-size:11.5px;color:var(--ink2)}
  td.wrapc{white-space:normal;min-width:160px;text-align:left}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 7px;border:1px solid var(--line2);margin:0 4px 4px 0;white-space:nowrap}
  .chip::before{content:'';width:5px;height:5px;background:var(--ink)}
  .chip.acc{border-color:var(--accent);color:var(--accent-ink)}
  .chip.acc::before{background:var(--accent)}
  tr.detail{cursor:default}
  tr.detail:hover{background:#fff}
  tr.detail td{white-space:normal;text-align:left;background:#fff;padding:16px 14px 20px}
  .dgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px}
  .dgrid h3{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:8px}
  .dgrid ol{margin:0;padding-left:18px}
  .dgrid li{margin:3px 0}

  .tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .tools input{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line2);min-width:200px}
  .tools input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .tools .hint{font-size:12.5px;color:var(--mut)}

  .note{font-size:12.5px;color:var(--mut);margin-top:10px}
  .callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;font-size:13.5px;margin-top:16px}
  .callout b{color:var(--accent-ink)}
  .empty{padding:48px 0;text-align:center;color:var(--mut)}
  svg text{font-family:inherit}
  .spin{width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:48px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}

  @media (max-width:860px){
    .kpis{grid-template-columns:1fr 1fr}
    .kpi:nth-child(3){border-left:0}
    .kpi:nth-child(n+3){border-top:1px solid var(--line)}
    .grid2,.dgrid{grid-template-columns:1fr}
    .wrap{padding:24px 16px 80px}
    .bar{grid-template-columns:20px 1fr auto 48px;gap:4px 8px}
    .bar .tr{grid-column:2 / -1;grid-row:2;height:8px}
    .bar .nm{white-space:normal}
    .tab{min-height:44px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <h1>Postype Market</h1>
      <div class="feed" id="feed">포스타입 '나페스' 시장 — 누구로 써야 돈이 되나</div>
    </div>
  </header>
  <div class="tabsrow"><nav class="tabs" id="tabs" role="tablist"></nav></div>
  <main id="view"><div class="spin" aria-label="불러오는 중"></div></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
const LOCAL = /[?&]local=1/.test(location.search);
let db = null, auth = null;
if (!LOCAL) {
  firebase.initializeApp({
    apiKey: "AIzaSyCdVHmS40id2qOMm6sYdHp9I4loW22lgaQ",
    authDomain: "the-atelier-99b8c.firebaseapp.com",
    projectId: "the-atelier-99b8c",
    storageBucket: "the-atelier-99b8c.firebasestorage.app",
    messagingSenderId: "820580020945",
    appId: "1:820580020945:web:d8d8d284e9e21e83eccbf0"
  });
  db = firebase.firestore(); auth = firebase.auth();
}
const ALLOWED_EMAIL = 'nury6942@gmail.com';
const MY = ['bichu-attic', 'hotnncold'];
const TABS = [['overview','Overview'],['idols','Idols'],['authors','Authors'],['series','Series'],['me','Me vs Market']];
const WD = ['일','월','화','수','목','금','토'];
let D = null, tab = 'overview';
const UI = { idolMode: 'people', sort: {}, open: {}, q: {} };
try { const t = localStorage.getItem('atelier_pmkt_tab'); if (TABS.some(x => x[0] === t)) tab = t; } catch (e) {}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => n == null ? '—' : Number(n).toLocaleString('ko-KR');
const fmtK = n => { if (n == null) return '—'; n = Number(n); if (n >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'') + '억'; if (n >= 1e4) return Math.round(n/1e4).toLocaleString('ko-KR') + '만'; return n.toLocaleString('ko-KR'); };
const won = n => n == null ? '—' : fmtK(n) + '원';
const pct = n => n == null ? '—' : n + '%';
const gw = n => n == null ? '<span class="flat">—</span>' : n > 5 ? `<span class="up">▲${Math.round(n)}%</span>` : n < -5 ? `<span class="dn">▼${Math.abs(Math.round(n))}%</span>` : `<span class="flat">${n > 0 ? '+' : ''}${Math.round(n)}%</span>`;
const chUrl = n => 'https://www.postype.com/@' + encodeURIComponent(n);
const seriesUrl = s => chUrl(s.channelName) + '/series/' + s.id;
const mLabel = m => (+m.slice(5)) + '월';
const last3rev = x => (D.meta.last3 || []).reduce((s, m) => s + ((x.monthly || {})[m]?.[2] || 0), 0);

/* ───────── 데이터 */
async function load(){
  try {
    if (LOCAL) { D = await (await fetch('./.local/market.json?t=' + Date.now())).json(); }
    else {
      const head = await db.collection('postypeMarket').doc('latest').get();
      if (!head.exists) { view('<p class="empty">아직 수집한 데이터가 없어요</p>'); return; }
      const h = head.data(); const parts = [];
      for (let i = 0; i < h.parts; i++) parts.push(db.collection('postypeMarket').doc('latest_' + i).get());
      const docs = await Promise.all(parts);
      D = JSON.parse(docs.map(d => d.data().json).join(''));
    }
    D.seriesById = Object.fromEntries((D.series || []).map(s => [s.id, s]));
    const m = D.meta;
    document.getElementById('feed').innerHTML = `포스타입 '나페스' 검색 · <b>${esc(m.from)} ~ ${esc(m.to)}</b> · 글 <b>${fmtN(m.posts)}</b>개 · 수집 <b>${esc((m.collectedAt||'').slice(0,10))}</b>`;
    render();
  } catch (e) { console.error(e); view('<p class="empty">불러오지 못했어요 · ' + esc(e.message) + '</p>'); }
}
const view = html => { document.getElementById('view').innerHTML = html; };

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(([id, l]) => `<button class="tab${id === tab ? ' on' : ''}" role="tab" aria-selected="${id === tab}" data-tab="${id}">${l}</button>`).join('');
}
function render(){
  renderTabs();
  if (!D) return;
  ({ overview, idols, authors, series, me })[tab]();
}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; try { localStorage.setItem('atelier_pmkt_tab', tab); } catch (e) {}
  render(); window.scrollTo(0, 0);
});

/* ───────── 차트 조각 */
function barList(rows, { val, label, sub, growth, mine, fmt = won }){
  const max = Math.max(1, ...rows.map(val));
  return `<div class="bars">${rows.map((r, i) => `<div class="bar">
    <span class="rk num">${i + 1}</span>
    <span class="nm">${esc(label(r))}${sub ? `<small>${esc(sub(r))}</small>` : ''}</span>
    <span class="tr"><span class="fl${mine && mine(r) ? ' mine' : ''}" style="width:${(100 * val(r) / max).toFixed(1)}%"></span></span>
    <span class="vv num">${fmt(val(r))}</span>
    <span class="gw num">${growth ? gw(growth(r)) : ''}</span></div>`).join('')}</div>`;
}
function monthCols(months, { val, fmt = won, h = 160, hiLast = true }){
  const W = 760, pad = 26, n = months.length, bw = (W - pad) / n;
  const max = Math.max(1, ...months.map(val));
  const cols = months.map((m, i) => {
    const v = val(m), bh = Math.max(1, (h - 34) * v / max), x = pad + i * bw + bw * 0.18, w = bw * 0.64, y = h - 20 - bh;
    const partial = i === n - 1 && hiLast;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" fill="${partial ? 'var(--bar3)' : 'var(--accent)'}"><title>${m.month} ${fmt(v)}</title></rect>
      <text x="${(x + w / 2).toFixed(1)}" y="${h - 5}" font-size="11" text-anchor="middle" fill="var(--ink2)">${mLabel(m.month)}</text>
      <text x="${(x + w / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" font-size="10.5" text-anchor="middle" fill="var(--ink)" font-weight="600">${fmtK(v)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="월별 막대">${cols}<line x1="${pad}" x2="${W}" y1="${h - 20}" y2="${h - 20}" stroke="var(--line2)"/></svg>`;
}
function spark(vals, { w = 120, h = 28, color = 'var(--accent)' } = {}){
  if (!vals.length) return '';
  const max = Math.max(1, ...vals), bw = w / vals.length;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${vals.map((v, i) => { const bh = Math.max(1, (h - 2) * v / max); return `<rect x="${(i * bw).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${Math.max(1, bw - 1).toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}"/>`; }).join('')}</svg>`;
}

/* ───────── Overview */
function overview(){
  const m = D.meta, months = D.months;
  const full = months.slice(0, -1); // 마지막 달은 진행 중
  const totRev = months.reduce((s, x) => s + x.estRev, 0);
  const totCh = m.channelsTotal || D.authors.length;
  const paid = Math.round(months.reduce((s, x) => s + x.paidRatio * x.posts, 0) / Math.max(1, months.reduce((s, x) => s + x.posts, 0)));
  const ppl = [...D.people].map(p => ({ ...p, r3: last3rev(p) })).sort((a, b) => b.r3 - a.r3);
  const rising = ppl.filter(p => p.r3 > ppl[Math.min(29, ppl.length - 1)].r3 && p.revShareGrowth != null).sort((a, b) => b.revShareGrowth - a.revShareGrowth).slice(0, 8);
  const grp = [...D.groups].map(g => ({ ...g, r3: last3rev(g) })).sort((a, b) => b.r3 - a.r3).slice(0, 10);
  const th = [...D.themes].map(t => ({ ...t, r3: last3rev(t) })).sort((a, b) => b.revPerPaidPost - a.revPerPaidPost).slice(0, 10);
  const top = ppl[0], l3 = (m.last3 || []).map(mLabel).join('·');
  view(`
    <div class="kpis">
      <div class="kpi"><div class="l">글 수</div><div class="v num">${fmtN(m.posts)}</div><div class="s">${months.length}달 · 한 달 평균 ${fmtN(Math.round(m.posts / Math.max(1, months.length)))}</div></div>
      <div class="kpi"><div class="l">쓰는 채널</div><div class="v num">${fmtN(totCh)}</div><div class="s">한 번이라도 '나페스' 글을 올린 곳</div></div>
      <div class="kpi"><div class="l">추정 시장 매출</div><div class="v num">${won(totRev)}</div><div class="s">유료 글 조회 × 가격 × 구매율(단건 ${Math.round(m.buyRate.single * 100)}% · 묶음 ${Math.round(m.buyRate.bundle * 100)}%)</div></div>
      <div class="kpi"><div class="l">유료 글 비율</div><div class="v num">${paid}%</div><div class="s">나머지는 무료 글(구독 유입용)</div></div>
    </div>
    ${top ? `<div class="callout">최근 3달(${l3}) 돈이 가장 많이 도는 이름은 <b>${esc(top.key)}</b>(${esc(top.group)})예요. 이 기간 추정 매출 ${won(top.r3)}, 시장의 ${pct(top.revShare3m)}.</div>` : ''}
    <div class="grid2 sec">
      <section class="card">
        <div class="sech"><h2>Who Makes Money</h2><p>최근 3달 추정 매출 · 옆은 직전 3달 대비 점유 변화</p></div>
        ${barList(ppl.slice(0, 15), { val: p => p.r3, label: p => p.key, sub: p => p.group + ' · 작가 ' + p.channels + '명', growth: p => p.revShareGrowth })}
      </section>
      <section class="card">
        <div class="sech"><h2>Rising</h2><p>매출 상위 30 안에서 점유가 가장 빨리 느는 이름</p></div>
        ${rising.length ? barList(rising, { val: p => p.revShareGrowth, label: p => p.key, sub: p => p.group + ' · 3달 ' + won(p.r3), fmt: v => '+' + Math.round(v) + '%' }) : '<p class="empty">비교할 달이 아직 모자라요</p>'}
        <div class="sech" style="margin-top:24px"><h2>Groups</h2><p>최근 3달 추정 매출</p></div>
        ${barList(grp, { val: g => g.r3, label: g => g.key, sub: g => '글 ' + fmtN(g.posts) + ' · 작가 ' + fmtN(g.channels), growth: g => g.revShareGrowth })}
      </section>
    </div>
    <section class="sec card">
      <div class="sech"><h2>Market by Month</h2><p>발행월 기준 추정 매출(누적 조회라 최근 달은 덜 쌓임) · 연한 막대는 진행 중인 달</p></div>
      ${monthCols(months, { val: x => x.estRev })}
      <div class="sech" style="margin-top:20px"><h2 style="font-size:14px">글 수</h2></div>
      ${monthCols(months, { val: x => x.posts, fmt: fmtN, h: 120 })}
    </section>
    <section class="sec card">
      <div class="sech"><h2>Themes</h2><p>결별 유료 글 1편 추정 매출(가운데값) 순 · 결은 태그·제목에서 찾음</p></div>
      ${barList(th, { val: t => t.revPerPaidPost || 0, label: t => t.key, sub: t => '글 ' + fmtN(t.posts) + ' · 유료 ' + pct(t.paidRatio), growth: t => t.revShareGrowth })}
    </section>
    <p class="note">${esc(m.note)} 최근 달일수록 아직 덜 읽혀서 월별 매출이 낮게 나와요. 그래서 뜨고 지는 건 그 달 안 점유율로 비교해요.</p>
  `);
}

/* ───────── 정렬 표 공통 */
function table(id, rows, cols, { rowClass, detail, keyOf } = {}){
  const st = UI.sort[id] || (UI.sort[id] = { k: cols.find(c => c.def)?.k || cols[1].k, asc: false });
  const col = cols.find(c => c.k === st.k);
  const sorted = [...rows].sort((a, b) => { const x = col.v(a), y = col.v(b); const r = (x == null) - (y == null) || (typeof x === 'string' ? x.localeCompare(y) : x - y); return st.asc ? r : -r; });
  const body = sorted.map(r => {
    const k = keyOf ? keyOf(r) : null, open = k != null && UI.open[id] === k;
    return `<tr class="${rowClass ? rowClass(r) : ''}${open ? ' open' : ''}" data-t="${id}" data-k="${esc(k)}">${cols.map(c => `<td class="${c.cls || ''}">${c.h(r)}</td>`).join('')}</tr>` +
      (open && detail ? `<tr class="detail"><td colspan="${cols.length}">${detail(r)}</td></tr>` : '');
  }).join('');
  return `<div class="tblwrap"><table><thead><tr>${cols.map(c => `<th class="${c.cls || ''}${c.k === st.k ? ' on' + (st.asc ? ' asc' : '') : ''}" data-sort="${id}|${c.k}" title="${esc(c.tip || '')}">${c.t}</th>`).join('')}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}" class="empty">없어요</td></tr>`}</tbody></table></div>`;
}
document.getElementById('view').addEventListener('click', e => {
  const th = e.target.closest('[data-sort]');
  if (th) { const [id, k] = th.dataset.sort.split('|'); const s = UI.sort[id]; if (s.k === k) s.asc = !s.asc; else { s.k = k; s.asc = false; } render(); return; }
  const seg = e.target.closest('[data-mode]');
  if (seg) { UI.idolMode = seg.dataset.mode; UI.open.idols = null; render(); return; }
  if (e.target.closest('a')) return;
  const tr = e.target.closest('tr[data-t]');
  if (tr && tr.dataset.k !== '') { const id = tr.dataset.t; UI.open[id] = UI.open[id] === tr.dataset.k ? null : tr.dataset.k; render(); }
});
document.getElementById('view').addEventListener('input', e => {
  if (e.target.matches('[data-q]')) { UI.q[e.target.dataset.q] = e.target.value; const pos = e.target.selectionStart; render(); const el = document.querySelector(`[data-q="${e.target.dataset.q}"]`); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});
const qf = (id, rows, fn) => { const q = (UI.q[id] || '').trim().toLowerCase(); return q ? rows.filter(r => fn(r).toLowerCase().includes(q)) : rows; };
const search = (id, ph, hint) => `<div class="tools"><input data-q="${id}" placeholder="${esc(ph)}" value="${esc(UI.q[id] || '')}" aria-label="${esc(ph)}"><span class="hint">${hint || ''}</span></div>`;

/* ───────── Idols */
function idols(){
  const mode = UI.idolMode;
  const src = mode === 'people' ? D.people : mode === 'groups' ? D.groups : D.themes;
  const rows = qf('idols', src.map(x => ({ ...x, r3: last3rev(x) })), r => r.key + ' ' + (r.group || ''));
  const months = D.meta.months || [];
  const cols = [
    { k: 'key', t: mode === 'themes' ? '결' : '이름', v: r => r.key, h: r => `<b>${esc(r.key)}</b>${r.group ? `<span class="sub">${esc(r.group)}</span>` : ''}` },
    { k: 'r3', t: '3달 매출', def: true, tip: '최근 3달 발행 글의 추정 매출', v: r => r.r3, h: r => won(r.r3) },
    { k: 'g', t: '점유 변화', tip: '직전 3달 대비 매출 점유율 변화', v: r => r.revShareGrowth, h: r => gw(r.revShareGrowth) },
    { k: 'estRev', t: '1년 매출', v: r => r.estRev, h: r => won(r.estRev) },
    { k: 'ppp', t: '유료 1편', tip: '유료 글 1편 추정 매출 가운데값 — 들어가서 한 편 팔면 얼마', v: r => r.revPerPaidPost, h: r => won(r.revPerPaidPost) },
    { k: 'rpc', t: '작가당', tip: '1년 매출 ÷ 쓰는 작가 수', v: r => r.revPerChannel, h: r => won(r.revPerChannel) },
    { k: 'posts', t: '글', v: r => r.posts, h: r => fmtN(r.posts) },
    { k: 'channels', t: '작가', v: r => r.channels, h: r => fmtN(r.channels) },
    { k: 'paid', t: '유료', v: r => r.paidRatio, h: r => pct(r.paidRatio) },
    { k: 'ml', t: '좋아요 중앙', v: r => r.medLikes, h: r => fmtN(r.medLikes) },
    { k: 'top3', t: '상위3 독점', tip: '상위 작가 3명이 차지하는 비율 — 높으면 이미 주인이 있는 시장', v: r => r.top3Share, h: r => pct(r.top3Share) },
    { k: 'solo', t: '단독 글', tip: '그 사람 혼자 나오는 글 수 (콜라보 아님)', v: r => r.soloPosts, h: r => mode === 'people' ? fmtN(r.soloPosts) : '—' },
    { k: 'trend', t: '월별 매출', v: r => last3rev(r), h: r => spark(months.map(m => r.monthly?.[m]?.[2] || 0)), cls: 'l' },
  ];
  const detail = r => {
    const ser = (r.topSeries || []).map(id => D.seriesById[id]).filter(Boolean);
    return `<div class="dgrid">
      <div><h3>월별 추정 매출</h3>${monthCols(months.map(m => ({ month: m, v: r.monthly?.[m]?.[2] || 0 })), { val: x => x.v, h: 130 })}</div>
      <div><h3>많이 버는 작가</h3><ol>${(r.topAuthors || []).map(n => { const a = D.authors.find(x => x.channelName === n); return `<li><a class="lnk" href="${chUrl(n)}" target="_blank" rel="noopener">${esc(a ? a.title : n)}</a>${a ? ` <span class="num" style="color:var(--ink2)">· 구독 ${fmtK(a.subscribers)}</span>` : ''}</li>`; }).join('')}</ol>
        <h3 style="margin-top:14px">자주 붙는 결</h3>${(r.themes || []).map(([t, n]) => `<span class="chip">${esc(t)} ${n}</span>`).join('') || '—'}</div>
      <div><h3>대표 시리즈</h3><ol>${ser.length ? ser.map(s => `<li><a class="lnk" href="${seriesUrl(s)}" target="_blank" rel="noopener">${esc(s.title)}</a> <span style="color:var(--ink2)">· ${s.eps}화 · ${won(s.estRev)}</span></li>`).join('') : '<li>회차를 받은 시리즈가 없어요</li>'}</ol></div>
    </div>`;
  };
  view(`<div class="sec">
    <div class="tools"><div class="seg" role="tablist">${[['people','People'],['groups','Groups'],['themes','Themes']].map(([k, l]) => `<button class="${k === mode ? 'on' : ''}" data-mode="${k}">${l}</button>`).join('')}</div>
    <input data-q="idols" placeholder="이름 찾기" value="${esc(UI.q.idols || '')}" aria-label="이름 찾기"><span class="hint">줄을 누르면 작가·시리즈가 펼쳐져요 · 머리를 누르면 정렬</span></div>
    ${table('idols', rows, cols, { keyOf: r => r.key, detail })}
    ${mode === 'people' && D.unknownTags?.length ? `<p class="note">사전에 없는 자주 나오는 태그: ${D.unknownTags.slice(0, 30).map(u => esc(u.tag) + ' ' + u.posts).join(' · ')}</p>` : ''}
  </div>`);
}

/* ───────── Authors */
function authors(){
  const rows = qf('authors', D.authors, r => r.title + ' ' + r.author + ' ' + r.channelName + ' ' + r.people.join(' '));
  const cols = [
    { k: 'title', t: '채널', v: r => r.title, h: r => `<a class="lnk" href="${chUrl(r.channelName)}" target="_blank" rel="noopener"><b>${esc(r.title)}</b></a><span class="sub">${esc(r.author || '')}</span>` },
    { k: 'estRev', t: '1년 매출', def: true, v: r => r.estRev, h: r => won(r.estRev) },
    { k: 'subs', t: '구독자', v: r => r.subscribers, h: r => fmtN(r.subscribers) },
    { k: 'posts', t: '글', v: r => r.posts, h: r => fmtN(r.posts) },
    { k: 'paid', t: '유료 글', v: r => r.paidPosts, h: r => fmtN(r.paidPosts) },
    { k: 'price', t: '가격', v: r => r.medPrice, h: r => r.medPrice ? fmtN(r.medPrice) + 'P' : '—' },
    { k: 'likes', t: '좋아요', v: r => r.likes, h: r => fmtK(r.likes) },
    { k: 'gap', t: '발행 간격', tip: '글 사이 간격 가운데값(일)', v: r => r.medGapDays, h: r => r.medGapDays == null ? '—' : r.medGapDays + '일' },
    { k: 'maxgap', t: '최장 공백', v: r => r.maxGapDays, h: r => r.maxGapDays == null ? '—' : Math.round(r.maxGapDays) + '일' },
    { k: 'last', t: '마지막 글', v: r => r.lastPost, h: r => esc(r.lastPost.slice(2)) },
    { k: 'ppl', t: '주력', v: r => r.people.join(','), h: r => r.people.map(p => `<span class="chip">${esc(p)}</span>`).join(''), cls: 'wrapc' },
    { k: 'mr', t: '월별 매출', v: r => r.estRev, h: r => spark(r.monthlyRev), cls: 'l' },
  ];
  view(`<div class="sec">${search('authors', '채널·작가·인물 찾기', `매출 추정 상위 ${D.authors.length}개 채널 · 굵은 바탕은 내 채널`)}
    ${table('authors', rows, cols, { rowClass: r => r.mine ? 'mine' : '' })}</div>`);
}

/* ───────── Series */
function series(){
  const rows = qf('series', D.series, r => r.title + ' ' + r.channelTitle + ' ' + r.people.join(' ') + ' ' + r.themes.join(' '));
  const cols = [
    { k: 'title', t: '시리즈', v: r => r.title, h: r => `<a class="lnk" href="${seriesUrl(r)}" target="_blank" rel="noopener"><b>${esc(r.title)}</b></a><span class="sub">${esc(r.channelTitle)}</span>` },
    { k: 'estRev', t: '추정 매출', def: true, v: r => r.estRev, h: r => won(r.estRev) },
    { k: 'eps', t: '화수', v: r => r.eps, h: r => fmtN(r.eps) },
    { k: 'start', t: '시작', v: r => r.start, h: r => esc(r.start.slice(2)) },
    { k: 'since', t: '최근', tip: '마지막 회차 뒤 지난 날', v: r => -r.daysSinceLast, h: r => r.daysSinceLast <= 14 ? `<span class="up">연재 중</span>` : r.daysSinceLast + '일 전' },
    { k: 'when', t: '요일·시', v: r => r.weekday, h: r => r.weekday == null ? '—' : WD[r.weekday] + ' ' + r.hour + '시' },
    { k: 'gap', t: '간격', v: r => r.medGapDays, h: r => r.medGapDays == null ? '—' : r.medGapDays + '일' },
    { k: 'free', t: '무료 화', v: r => r.firstPaidEp, h: r => r.firstPaidEp ? (r.firstPaidEp - 1) + '화' : '전부 무료' },
    { k: 'price', t: '가격', v: r => r.medPrice, h: r => r.medPrice ? fmtN(r.medPrice) + 'P' : '—' },
    { k: 'ret', t: '유지율', tip: '마지막 화 조회 ÷ 1화 조회', v: r => r.retention, h: r => pct(r.retention) },
    { k: 'ppl', t: '인물·결', v: r => r.people.join(','), h: r => r.people.slice(0, 3).map(p => `<span class="chip acc">${esc(p)}</span>`).join('') + r.themes.slice(0, 2).map(p => `<span class="chip">${esc(p)}</span>`).join(''), cls: 'wrapc' },
    { k: 'curve', t: '회차별 조회', v: r => r.views, h: r => spark(r.curve.map(c => c[0]), { w: 140, color: 'var(--ink)' }), cls: 'l' },
  ];
  view(`<div class="sec">${search('series', '시리즈·인물·결 찾기', `회차 전체를 받은 시리즈 ${D.series.length}개`)}
    ${table('series', rows, cols, { rowClass: r => r.mine ? 'mine' : '' })}</div>`);
}

/* ───────── Me vs Market */
function me(){
  const ranked = [...D.authors];
  const mine = MY.map(n => ({ n, a: ranked.find(x => x.channelName === n), rank: ranked.findIndex(x => x.channelName === n) + 1 }));
  const mySeries = D.series.filter(s => s.mine);
  const paidSeries = D.series.filter(s => s.medPrice && s.eps >= 8);
  const med = (arr) => { const s = arr.filter(x => x != null).sort((a, b) => a - b); return s.length ? s[s.length >> 1] : null; };
  const mk = { free: med(paidSeries.map(s => s.firstPaidEp && s.firstPaidEp - 1)), price: med(paidSeries.map(s => s.medPrice)), ret: med(paidSeries.map(s => s.retention)), gap: med(paidSeries.map(s => s.medGapDays)), eps: med(paidSeries.map(s => s.eps)) };
  const wd = {}; for (const s of paidSeries.slice(0, 100)) if (s.weekday != null) wd[s.weekday] = (wd[s.weekday] || 0) + 1;
  const wdTop = Object.entries(wd).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, n]) => WD[k] + ' ' + n);
  const riku = D.people.find(p => p.key === '리쿠'), bh = D.people.find(p => p.key === '변백현');
  view(`
    <div class="kpis">
      ${mine.map(({ n, a, rank }) => `<div class="kpi"><div class="l">${n === 'bichu-attic' ? '고요한 다락방' : '요란한 옥탑방'}</div><div class="v num">${a ? rank + '위' : '—'}</div><div class="s">${a ? '이 기간 추정 매출 ' + won(a.estRev) + ' · 채널 ' + fmtN(D.authors.length) + '곳 중' : '이 기간 나페스 글 없음'}</div></div>`).join('')}
      <div class="kpi"><div class="l">리쿠 시장</div><div class="v num">${riku ? won(last3rev(riku)) : '—'}</div><div class="s">${riku ? '최근 3달 · 단독 글 ' + fmtN(riku.soloPosts) + ' / 전체 ' + fmtN(riku.posts) + ' · 상위3 독점 ' + pct(riku.top3Share) : ''}</div></div>
      <div class="kpi"><div class="l">백현 시장</div><div class="v num">${bh ? won(last3rev(bh)) : '—'}</div><div class="s">${bh ? '최근 3달 · 작가 ' + fmtN(bh.channels) + '명 · 상위3 독점 ' + pct(bh.top3Share) : '이 기간 글 적음'}</div></div>
    </div>
    <section class="sec card">
      <div class="sech"><h2>잘 팔리는 유료 시리즈의 보통값</h2><p>회차 전체를 받은 유료 시리즈(8화 이상) ${paidSeries.length}개 가운데값</p></div>
      <div class="kpis" style="margin-top:0">
        <div class="kpi"><div class="l">무료 화수</div><div class="v num">${mk.free ?? '—'}화</div><div class="s">내 시리즈는 보통 3~4화</div></div>
        <div class="kpi"><div class="l">회당 가격</div><div class="v num">${mk.price ? fmtN(mk.price) + 'P' : '—'}</div><div class="s">내 시리즈 500P</div></div>
        <div class="kpi"><div class="l">유지율</div><div class="v num">${pct(mk.ret)}</div><div class="s">마지막 화 ÷ 1화</div></div>
        <div class="kpi"><div class="l">발행 간격</div><div class="v num">${mk.gap ?? '—'}일</div><div class="s">자주 쓰는 요일 ${esc(wdTop.join(' · '))}</div></div>
      </div>
    </section>
    <section class="sec">
      <div class="sech"><h2>내 시리즈</h2><p>이번 수집에 걸린 것만</p></div>
      ${mySeries.length ? table('myseries', mySeries, [
        { k: 'title', t: '시리즈', v: r => r.title, h: r => `<a class="lnk" href="${seriesUrl(r)}" target="_blank" rel="noopener"><b>${esc(r.title)}</b></a><span class="sub">${esc(r.channelTitle)}</span>` },
        { k: 'estRev', t: '추정 매출', def: true, v: r => r.estRev, h: r => won(r.estRev) },
        { k: 'eps', t: '화수', v: r => r.eps, h: r => r.eps },
        { k: 'ret', t: '유지율', v: r => r.retention, h: r => pct(r.retention) },
        { k: 'curve', t: '회차별 조회', v: r => r.views, h: r => spark(r.curve.map(c => c[0]), { w: 160, color: 'var(--ink)' }), cls: 'l' },
      ]) : '<p class="empty">이 기간 내 시리즈가 나페스 검색에 안 걸렸어요</p>'}
    </section>
    <section class="sec">
      <div class="sech"><h2>추정이 얼마나 맞나</h2><p>내 시리즈: 이 페이지 방식의 추정 vs 스튜디오 실제 매출(lifetime)</p></div>
      ${(D.check || []).length ? `<div class="tblwrap"><table><thead><tr><th>시리즈</th><th>추정</th><th>실제</th><th>차이</th></tr></thead><tbody>${D.check.map(c => `<tr><td><b>${esc(c.series)}</b><span class="sub">${c.channelName === 'bichu-attic' ? '고요한 다락방' : '요란한 옥탑방'}</span></td><td>${won(c.est)}</td><td>${won(c.actual)}</td><td>${c.actual ? gw(100 * (c.est - c.actual) / c.actual) : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">비교할 내 시리즈가 없어요</p>'}
      <p class="note">추정 = 유료 글 조회 × 가격 × 구매율(단건 ${Math.round(D.meta.buyRate.single * 100)}% · 묶음 ${Math.round(D.meta.buyRate.bundle * 100)}%). 실제보다 낮게 나오면 시장 숫자도 '최소 이만큼'으로 읽으면 돼요.</p>
    </section>
  `);
}

/* ───────── 시작 */
if (LOCAL) load();
else auth.onAuthStateChanged(user => {
  if (!user || user.email !== ALLOWED_EMAIL) { view('<p class="empty">메인 화면에서 로그인하면 보여요</p>'); return; }
  load();
});
</script>
</body>
</html>
