<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Postype Market</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 아뜰리에 정본(DESIGN.md): 흰 바탕·직각·코발트 하나·Pretendard·그림자 없음·연회색 글자 없음
     데이터: 아이맥 scripts/postype-market/ (Aside 로 포스타입 '나페스' 검색 1년치) → Firestore postypeMarket/latest_* */
  :root{
    --accent:#1F4BD8; --accent-ink:#1A3FB5; --accent-soft:#EEF2FD; --sel:#F3F6FE;
    --ink:#16161A; --ink2:#5B5B66; --mut:#475569;
    --line:#ECECF0; --line2:#DCDCE3; --surface:#F8F8FA;
    --green:#15803D; --red:#DC2626;
    --bar2:#9DB0EE; --bar3:#C9D4F5;
  }
  *{box-sizing:border-box;border-radius:0}
  html,body{margin:0;background:#fff;color:var(--ink)}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden;font-size:14px;line-height:1.55}
  a{color:inherit;text-decoration:none}
  a.lnk:hover{color:var(--accent);text-decoration:underline}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
  h1,h2,h3{text-wrap:balance;margin:0}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 96px}

  .mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
  .mast h1{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .mast .feed{font-size:12.5px;font-weight:500;color:var(--ink2)}
  .mast .feed b{font-weight:700;color:var(--ink)}

  .tabsrow{display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);margin-top:20px}
  .tabs{display:flex;gap:24px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:10px 0 12px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--ink)}

  .seg{display:inline-flex;background:var(--surface);padding:2px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:none}
  .seg button{padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2);border:1px solid transparent}
  .seg button.on{background:#fff;color:var(--ink);border-color:var(--ink)}

  .sec{margin-top:32px}
  .sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .sech h2{font-size:16px;font-weight:700}
  .sech p{margin:0;font-size:12.5px;color:var(--mut)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-top:24px}
  .kpi{padding:16px 18px;border-left:1px solid var(--line)}
  .kpi:first-child{border-left:0}
  .kpi .l{font-size:12.5px;font-weight:600;color:var(--ink2)}
  .kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .kpi .s{font-size:12px;color:var(--mut);margin-top:2px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .card{border:1px solid var(--line);padding:18px}

  /* 가로 막대 목록 */
  .bars{display:flex;flex-direction:column;gap:2px}
  .bar{display:grid;grid-template-columns:22px minmax(92px,150px) 1fr 86px 58px;align-items:center;gap:10px;padding:5px 0;font-size:13px}
  .bar .rk{color:var(--ink2);font-weight:600}
  .bar .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .nm small{display:block;font-size:11.5px;font-weight:500;color:var(--ink2)}
  .bar .tr{height:14px;background:var(--surface);position:relative}
  .bar .fl{position:absolute;inset:0 auto 0 0;background:var(--accent)}
  .bar .fl.mine{background:var(--ink)}
  .bar .vv{text-align:right;font-weight:700}
  .bar .gw{text-align:right;font-size:12px;font-weight:700}
  .up{color:var(--green)} .dn{color:var(--red)} .flat{color:var(--ink2)}

  /* 표 */
  .tblwrap{overflow-x:auto;border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{font-size:12px;font-weight:600;color:var(--ink2);background:#fff;position:sticky;top:0;cursor:pointer;user-select:none}
  th.on{color:var(--ink)}
  th.on::after{content:' ↓'}
  th.on.asc::after{content:' ↑'}
  th:first-child,td:first-child,th.l,td.l{text-align:left}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--surface)}
  tbody tr.mine{background:var(--sel)}
  tbody tr.open{background:var(--sel)}
  td .sub{display:block;font-size:11.5px;color:var(--ink2)}
  td.wrapc{white-space:normal;min-width:160px;text-align:left}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 7px;border:1px solid var(--line2);margin:0 4px 4px 0;white-space:nowrap}
  .chip::before{content:'';width:5px;height:5px;background:var(--ink)}
  .chip.acc{border-color:var(--accent);color:var(--accent-ink)}
  .chip.acc::before{background:var(--accent)}
  tr.detail{cursor:default}
  tr.detail:hover{background:#fff}
  tr.detail td{white-space:normal;text-align:left;background:#fff;padding:16px 14px 20px}
  .dgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px}
  .dgrid h3{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:8px}
  .dgrid ol{margin:0;padding-left:18px}
  .dgrid li{margin:3px 0}

  .dwrap{position:sticky;left:14px;max-width:min(1130px, calc(100vw - 80px))}
  .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .ins-head{margin-top:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .ins-head h2{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.35;max-width:760px}
  .ins-head .when{font-size:12.5px;color:var(--mut)}
  .ins-head select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line2);background:#fff}
  .todo{border:1px solid var(--ink);margin-top:20px}
  .todo h3{font-size:13px;font-weight:700;padding:10px 16px;border-bottom:1px solid var(--line);margin:0}
  .todo ol{margin:0;padding:0;list-style:none;counter-reset:t}
  .todo li{counter-increment:t;display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .todo li:last-child{border-bottom:0}
  .todo li::before{content:counter(t);font-weight:800;color:var(--accent)}
  .todo li b{font-size:14.5px}
  .todo li span{grid-column:2;font-size:12.5px;color:var(--mut)}
  .icards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}
  .icard{border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px}
  .icard .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .icard .sec-l{font-size:11.5px;font-weight:600;color:var(--ink2)}
  .vd{font-size:11.5px;font-weight:700;padding:2px 8px;border:1px solid currentColor}
  .vd.up{color:var(--green)} .vd.down{color:var(--red)} .vd.flat{color:var(--ink2)} .vd.watch{color:#B45309} .vd.do{color:#fff;background:var(--accent);border-color:var(--accent)}
  .icard h3{font-size:16px;font-weight:700;margin:0}
  .icard .stat{display:flex;align-items:baseline;gap:8px}
  .icard .stat b{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .icard .stat span{font-size:12.5px;color:var(--ink2)}
  .icard .sum{font-size:14.5px;font-weight:600;line-height:1.5}
  .icard ul{margin:0;padding-left:16px;font-size:13px;color:#334155}
  .icard li{margin:3px 0}
  .icard .refs button{font-size:11.5px;font-weight:600;padding:2px 7px;border:1px solid var(--line2);margin:0 4px 4px 0}
  .icard .refs button:hover{border-color:var(--accent);color:var(--accent)}
  @media (max-width:860px){.icards{grid-template-columns:1fr}.ins-head h2{font-size:19px}}
  .scn{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .scard{border:1px solid var(--line);padding:14px;min-width:0}
  .scard .l{font-size:12.5px;font-weight:700;color:var(--ink2)}
  .scard .v{font-size:26px;font-weight:800}
  .scard .s{font-size:12px;color:var(--mut);margin-bottom:8px}
  .scard .ex{margin-top:8px;font-size:13px}
  .scard .ex .sub{display:block;font-size:11.5px;color:var(--ink2)}
  @media (max-width:860px){.scn{grid-template-columns:1fr}}
  .ptn{display:flex;flex-wrap:wrap;gap:1px;margin-top:3px}
  .ptn i{width:7px;height:9px;background:var(--line)}
  .ptn i.on{background:var(--ink)}
  .pcards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:12px}
  .pcard{border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px}
  .pcard{min-width:0}
  .pstats b{overflow-wrap:anywhere}
  .ptl svg{max-width:100%}
  .pcard .ph b{font-size:16px}
  .pcard .ph .sub{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
  .pstats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px}
  .pstats div{display:flex;flex-direction:column}
  .pstats span{color:var(--ink2);font-size:11.5px}
  .pstats b{font-weight:700}
  .pser{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
  .pser span{color:var(--ink2);font-size:12px}
  .pser p{margin:2px 0 0;font-size:12px;color:var(--mut)}
  .ptl .sub{display:block;font-size:11.5px;color:var(--ink2)}
  @media (max-width:860px){.pcards{grid-template-columns:1fr}}
  .acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .acard{border:1px solid var(--line);padding:14px}
  .acard.mine{border-color:var(--ink)}
  .acard .ah{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .acard .ah .rk{color:var(--ink2);font-weight:700}
  .acard .ah .sh{margin-left:auto;font-weight:700;color:var(--accent-ink)}
  .acard dl{margin:0;display:grid;gap:3px;font-size:12.5px}
  .acard dl div{display:flex;gap:8px}
  .acard dt{color:var(--ink2);min-width:64px}
  .acard dd{margin:0;font-weight:600}
  .acard .at{margin-top:8px}
  .tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .tools input{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line2);min-width:200px}
  .tools input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .tools .hint{font-size:12.5px;color:var(--mut)}

  .note{font-size:12.5px;color:var(--mut);margin-top:10px}
  .callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;font-size:13.5px;margin-top:16px}
  .callout b{color:var(--accent-ink)}
  .empty{padding:48px 0;text-align:center;color:var(--mut)}
  svg text{font-family:inherit}
  .spin{width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:48px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}

  @media (max-width:860px){
    .kpis{grid-template-columns:1fr 1fr}
    .kpi:nth-child(3){border-left:0}
    .kpi:nth-child(n+3){border-top:1px solid var(--line)}
    .grid2,.dgrid{grid-template-columns:1fr}
    .wrap{padding:24px 16px 80px}
    .bar{grid-template-columns:20px 1fr auto 48px;gap:4px 8px}
    .bar .tr{grid-column:2 / -1;grid-row:2;height:8px}
    .bar .nm{white-space:normal}
    .tab{min-height:44px}
  }

  /* ═══ 2026-11-07 다듬기: 회색 작은 글씨 없애고, 위계·구분 또렷하게 ═══ */
  :root{ --ink2:#3F3F46; --mut:#52525B; --line:#E4E4E9; --line2:#D4D4D8; }
  body{font-size:15px}
  .wrap{max-width:1200px;padding:28px 32px 120px}
  /* 머리 + 탭: 위에 붙어 있게 */
  .pm-top{position:sticky;top:0;z-index:5;background:#fff;margin:0 -32px;padding:20px 32px 0;border-bottom:1px solid var(--line)}
  .mast h1{font-size:28px;font-weight:800;letter-spacing:-.025em}
  .mast .feed{font-size:13.5px;color:var(--mut);margin-top:4px}
  .tabsrow{margin-top:14px;border-bottom:0}
  .tabs{gap:28px}
  .tab{font-size:15px;font-weight:600;color:var(--mut);padding:10px 0 13px}
  .tab.on{color:var(--ink);font-weight:800;border-bottom-width:3px}
  /* 구역 제목 */
  .sec{margin-top:40px}
  .sech{display:block;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
  .sech h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .sech p{font-size:13.5px;color:var(--mut);margin-top:4px}
  .card .sech{border-bottom:1px solid var(--line);padding-bottom:10px}
  .card .sech h2{font-size:17px}
  .card{padding:22px;border-color:var(--line2)}
  /* 보조 글씨 하한 */
  .note{font-size:13.5px;color:var(--mut);line-height:1.6;margin-top:14px}
  .tools .hint{font-size:13.5px;color:var(--mut)}
  td .sub,.sub{font-size:12.5px !important;color:var(--mut) !important}
  .chip{font-size:12.5px;color:var(--ink);border-color:var(--line2);padding:3px 8px}
  /* 숫자 칸 */
  .kpis{border-color:var(--line2)}
  .kpi{padding:18px 20px;border-color:var(--line2)}
  .kpi .l{font-size:13.5px;font-weight:700;color:var(--ink2)}
  .kpi .v{font-size:30px;margin-top:4px}
  .kpi .s{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.5}
  .callout{font-size:15px;padding:14px 18px;color:var(--ink);line-height:1.6}
  /* 버튼 묶음 */
  .seg{padding:3px;gap:3px}
  .seg button{font-size:13.5px;padding:7px 14px;color:var(--ink2)}
  .seg button.on{border-width:1.5px}
  .tools{gap:10px 14px;margin-bottom:16px}
  .tools input{font-size:14px;padding:8px 12px;border-color:var(--line2)}
  /* 가로 막대 */
  .bar{grid-template-columns:24px minmax(110px,170px) 1fr 96px 64px;padding:7px 0;font-size:14px;border-bottom:1px solid #F1F1F4}
  .bar:last-child{border-bottom:0}
  .bar .rk{font-size:13px;color:var(--mut)}
  .bar .nm{font-weight:700}
  .bar .nm small{font-size:12.5px;font-weight:500;color:var(--mut)}
  .bar .tr{height:12px;background:#F1F1F4}
  .bar .vv{font-size:14.5px;font-weight:800}
  .bar .gw{font-size:13px;font-weight:800}
  /* 표 */
  .tblwrap{border-color:var(--line2)}
  table{font-size:14px}
  th{font-size:13px;font-weight:700;color:var(--ink2);border-bottom:1.5px solid var(--ink);padding:11px 12px}
  td{padding:11px 12px}
  tbody tr:hover{background:#F7F8FC}
  /* Insights */
  .ins-head{margin-top:28px}
  .ins-head h2{font-size:26px;line-height:1.3}
  .ins-head .when{font-size:13.5px;color:var(--mut)}
  .todo{border:0;border-top:3px solid var(--accent);background:#FAFBFF;margin-top:24px}
  .todo h3{font-size:15px;font-weight:800;padding:14px 20px;border-bottom:1px solid var(--line)}
  .todo li{grid-template-columns:34px 1fr;padding:14px 20px}
  .todo li::before{font-size:18px}
  .todo li b{font-size:16px}
  .todo li span{font-size:13.5px;color:var(--mut)}
  .icards{gap:20px;margin-top:20px}
  .icard{border:1px solid var(--line2);border-left-width:5px;padding:20px 22px;gap:12px}
  .icard.v-up{border-left-color:var(--green)} .icard.v-down{border-left-color:var(--red)} .icard.v-watch{border-left-color:#B45309} .icard.v-do{border-left-color:var(--accent)} .icard.v-flat{border-left-color:var(--ink2)}
  .icard .sec-l{font-size:12.5px;font-weight:700;color:var(--mut)}
  .vd{font-size:12.5px;padding:3px 9px}
  .icard h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .icard .stat b{font-size:32px}
  .icard .stat span{font-size:13.5px;color:var(--mut)}
  .icard .sum{font-size:15.5px;font-weight:700}
  .icard ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
  .icard li{font-size:14px;color:#27272A;padding:7px 0;border-bottom:1px solid #F1F1F4;margin:0}
  .icard .refs button{font-size:12.5px;padding:4px 9px;border-color:var(--line2)}
  /* 카드류 */
  .acard,.pcard,.scard{border-color:var(--line2)}
  .acard dl{font-size:13.5px} .acard dt{color:var(--mut);min-width:72px}
  .pstats{font-size:14px;gap:10px 16px}
  .pstats span{font-size:12.5px;color:var(--mut)}
  .pser{font-size:14px} .pser span{font-size:13px;color:var(--mut)} .pser p{font-size:13px;color:var(--mut)}
  .scard .s{font-size:13px} .scard .ex{font-size:14px}
  .ptn i{width:8px;height:10px;background:#E4E4E9}
  @media (max-width:860px){
    .wrap{padding:16px 16px 96px}
    .pm-top{position:static;margin:0 -16px;padding:14px 16px 0;border-bottom:0}
    .tabsrow{position:sticky;top:0;z-index:5;background:#fff;margin:12px -16px 0;padding:0 16px;border-bottom:1px solid var(--line)}
    .mast h1{font-size:23px}
    .tabs{gap:20px}
    .ins-head h2{font-size:21px}
    .bar{grid-template-columns:22px 1fr auto 52px}
    .icard{padding:18px}
  }

  /* ═══ 2차 다듬기 (누리: 회색 작은 글씨 금지, 검은 덩어리 금지, 표 제대로) ═══
     보조 글씨도 먹색. 위계는 크기·굵기로, 라벨은 코발트. 표시용 칸·막대·칩은 코발트 계열 */
  :root{ --ink:#141418; --ink2:#141418; --mut:#2A2A30; --lab:#1A3FB5; --tint:#F2F5FE; --tint2:#DCE4FB; }
  body{letter-spacing:-.01em;line-height:1.65}
  p,li,.sum,.callout,.pser p,.note{line-height:1.75;word-break:keep-all}
  .mast .feed,.ins-head .when,.tools .hint,.note,.sech p,.kpi .s,.icard .stat span,.scard .s,.todo li span{color:var(--mut)}
  td .sub,.sub{color:var(--mut) !important}
  /* 라벨은 코발트 */
  .kpi .l,.pstats span,.acard dt,.scard .l,.icard .sec-l,.dgrid h3{color:var(--lab) !important;font-weight:700}
  .kpi .l{font-size:14px}
  .pstats span,.acard dt{font-size:13px}
  /* 칩: 검은 점·테두리 대신 옅은 바탕 */
  .chip{background:#F4F4F7;border:0;color:var(--ink);font-weight:600;font-size:13px;padding:4px 10px}
  .chip::before{display:none}
  .chip.acc{background:var(--tint);color:var(--accent-ink)}
  .refs button,.icard .refs button{background:var(--tint);border:0 !important;color:var(--accent-ink);font-weight:700}
  .refs button:hover{background:var(--tint2)}

<body>
<div class="wrap">

      <h1>Postype Market</h1>

    </div>
  </header>
  <div class="tabsrow"><nav class="tabs" id="tabs" role="tablist"></nav></div>
  </div>
  <main id="view"><div class="spin" aria-label="불러오는 중"></div></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
const LOCAL = /[?&]local=1/.test(location.search);
let db = null, auth = null;
if (!LOCAL) {
  firebase.initializeApp({
    apiKey: "AIzaSyCdVHmS40id2qOMm6sYdHp9I4loW22lgaQ",
    authDomain: "the-atelier-99b8c.firebaseapp.com",
    projectId: "the-atelier-99b8c",
    storageBucket: "the-atelier-99b8c.firebasestorage.app",
    messagingSenderId: "820580020945",
    appId: "1:820580020945:web:d8d8d284e9e21e83eccbf0"
  });
  db = firebase.firestore(); auth = firebase.auth();
}
const ALLOWED_EMAIL = 'nury6942@gmail.com';
const MY = ['bichu-attic', 'hotnncold'];
const TABS = [['insights','Insights'],['peers','Peers'],['overview','Overview'],['idols','Idols'],['playbook','Playbook'],['authors','Authors'],['series','Series'],['me','Me vs Market']];
const WD = ['일','월','화','수','목','금','토'];
let D = null, tab = 'insights', HIST = [], histSel = null;
const UI = { idolMode: 'people', sort: {}, open: {}, q: {} };
try { const t = localStorage.getItem('atelier_pmkt_tab'); if (TABS.some(x => x[0] === t) && localStorage.getItem('atelier_pmkt_ins_seen')) tab = t; localStorage.setItem('atelier_pmkt_ins_seen', '1'); } catch (e) {}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => n == null ? '—' : Number(n).toLocaleString('ko-KR');
const fmtK = n => { if (n == null) return '—'; n = Number(n); if (n >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'') + '억'; if (n >= 1e4) return Math.round(n/1e4).toLocaleString('ko-KR') + '만'; return n.toLocaleString('ko-KR'); };
const won = n => n == null ? '—' : fmtK(n) + '원';
const pct = n => n == null ? '—' : n + '%';
const gw = n => n == null ? '<span class="flat">—</span>' : n > 5 ? `<span class="up">▲${Math.round(n)}%</span>` : n < -5 ? `<span class="dn">▼${Math.abs(Math.round(n))}%</span>` : `<span class="flat">${n > 0 ? '+' : ''}${Math.round(n)}%</span>`;
const chUrl = n => 'https://www.postype.com/@' + encodeURIComponent(n);
const seriesUrl = s => chUrl(s.channelName) + '/series/' + s.id;
const mLabel = m => (+m.slice(5)) + '월';
const last3rev = x => (D.meta.last3 || []).reduce((s, m) => s + ((x.monthly || {})[m]?.[2] || 0), 0);
/* 기간·기준 고르기: 기간 = 최근 N개 '다 찬' 달, 기준 = 추정 매출 / 좋아요 / 글 수 */
const PERIODS = [['3', '3달'], ['6', '6달'], ['12', '1년']];
const METRICS = [['rev', '매출', 2], ['likes', '좋아요', 1], ['posts', '글 수', 0]];
try { UI.period = localStorage.getItem('atelier_pmkt_period') || '3'; UI.metric = localStorage.getItem('atelier_pmkt_metric') || 'rev'; } catch (e) { UI.period = '3'; UI.metric = 'rev'; }
function windows(){
  const lastFull = (D.meta.last3 || []).slice(-1)[0] || D.meta.months.slice(-2)[0];
  const full = D.meta.months.filter(m => m <= lastFull), n = +UI.period;
  const cur = full.slice(-n), prev = full.length >= 2 * n ? full.slice(-2 * n, -n) : null;
  return { cur, prev, label: n === 12 ? '1년' : n + '달', range: cur[0].slice(2).replace('-', '.') + '~' + cur[cur.length - 1].slice(2).replace('-', '.') };
}
const mIdx = () => METRICS.find(x => x[0] === UI.metric)[2];
const mName = () => METRICS.find(x => x[0] === UI.metric)[1];
const fmtM = v => UI.metric === 'rev' ? won(v) : fmtK(v);
const mTotal = (ms) => { const k = mIdx(); return ms.reduce((s, m) => { const r = D.months.find(x => x.month === m); return s + (r ? [r.posts, r.likes, r.estRev][k] : 0); }, 0) || 1; };
const inWin = (x, ms) => { const k = mIdx(); return ms.reduce((s, m) => s + ((x.monthly || {})[m]?.[k] || 0), 0); };
function score(x){
  const w = windows(); const v = inWin(x, w.cur), sh = v / mTotal(w.cur);
  const g = w.prev ? (() => { const ps = inWin(x, w.prev) / mTotal(w.prev); return ps > 0 ? 100 * (sh - ps) / ps : null; })() : null;
  return { v, share: Math.round(1000 * sh) / 10, growth: g };
}
const pickers = () => `<div class="seg" role="group" aria-label="기간">${PERIODS.map(([k, l]) => `<button class="${k === UI.period ? 'on' : ''}" data-period="${k}">${l}</button>`).join('')}</div>
  <div class="seg" role="group" aria-label="기준">${METRICS.map(([k, l]) => `<button class="${k === UI.metric ? 'on' : ''}" data-metric="${k}">${l}</button>`).join('')}</div>`;

/* ───────── 데이터 */
async function load(){
  try {
    if (LOCAL) { D = await (await fetch('./.local/market.json?t=' + Date.now())).json(); }
    else {
      const head = await db.collection('postypeMarket').doc('latest').get();
      if (!head.exists) { view('<p class="empty">아직 수집한 데이터가 없어요</p>'); return; }
      const h = head.data(); const parts = [];
      for (let i = 0; i < h.parts; i++) parts.push(db.collection('postypeMarket').doc('latest_' + i).get());
      const docs = await Promise.all(parts);
      D = JSON.parse(docs.map(d => d.data().json).join(''));
    }
    D.seriesById = Object.fromEntries((D.series || []).map(s => [s.id, s]));
    if (!LOCAL) { try { const hs = await db.collection('postypeMarketInsights').orderBy(firebase.firestore.FieldPath.documentId(), 'desc').limit(16).get(); HIST = hs.docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) { console.warn(e); } }
    const m = D.meta;
    document.getElementById('feed').innerHTML = `포스타입 '나페스' 검색 · <b>${esc(m.from)} ~ ${esc(m.to)}</b> · 글 <b>${fmtN(m.posts)}</b>개 · 수집 <b>${esc((m.collectedAt||'').slice(0,10))}</b>`;
    render();
  } catch (e) { console.error(e); view('<p class="empty">불러오지 못했어요 · ' + esc(e.message) + '</p>'); }
}
const view = html => { document.getElementById('view').innerHTML = html; };

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(([id, l]) => `<button class="tab${id === tab ? ' on' : ''}" role="tab" aria-selected="${id === tab}" data-tab="${id}">${l}</button>`).join('');
}
function render(){
  renderTabs();
  if (!D) return;
  ({ insights, peers, overview, idols, playbook, authors, series, me })[tab]();
}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; try { localStorage.setItem('atelier_pmkt_tab', tab); } catch (e) {}
  render(); window.scrollTo(0, 0);
});

/* ───────── 차트 조각 */
function barList(rows, { val, label, sub, growth, mine, fmt = won }){
  const max = Math.max(1, ...rows.map(val));
  return `<div class="bars">${rows.map((r, i) => `<div class="bar">
    <span class="rk num">${i + 1}</span>
    <span class="nm">${esc(label(r))}${sub ? `<small>${esc(sub(r))}</small>` : ''}</span>
    <span class="tr"><span class="fl${mine && mine(r) ? ' mine' : ''}" style="width:${(100 * val(r) / max).toFixed(1)}%"></span></span>
    <span class="vv num">${fmt(val(r))}</span>
    <span class="gw num">${growth ? gw(growth(r)) : ''}</span></div>`).join('')}</div>`;
}
function monthCols(months, { val, fmt = won, h = 160, hiLast = true }){
  const W = 760, pad = 26, n = months.length, bw = (W - pad) / n;
  const max = Math.max(1, ...months.map(val));
  const cols = months.map((m, i) => {
    const v = val(m), bh = Math.max(1, (h - 34) * v / max), x = pad + i * bw + bw * 0.18, w = bw * 0.64, y = h - 20 - bh;
    const partial = i === n - 1 && hiLast;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" fill="${partial ? 'var(--bar3)' : 'var(--accent)'}"><title>${m.month} ${fmt(v)}</title></rect>
      <text x="${(x + w / 2).toFixed(1)}" y="${h - 5}" font-size="11" text-anchor="middle" fill="var(--ink2)">${mLabel(m.month)}</text>
      <text x="${(x + w / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" font-size="10.5" text-anchor="middle" fill="var(--ink)" font-weight="600">${fmtK(v)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="월별 막대">${cols}<line x1="${pad}" x2="${W}" y1="${h - 20}" y2="${h - 20}" stroke="var(--line2)"/></svg>`;
}
function spark(vals, { w = 120, h = 28, color = 'var(--accent)' } = {}){
  if (!vals.length) return '';
  const max = Math.max(1, ...vals), bw = w / vals.length;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${vals.map((v, i) => { const bh = Math.max(1, (h - 2) * v / max); return `<rect x="${(i * bw).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${Math.max(1, bw - 1).toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}"/>`; }).join('')}</svg>`;
}

/* ───────── Insights — 월·목 분석 카드 (insights.mjs 가 claude 로 씀) */
const SECT = { peers: 'Peers', market: 'Market', idols: 'Idols', keywords: 'Keywords', authors: 'Authors', playbook: 'Playbook', me: 'Me' };
const VD = { up: '▲ 뜸', down: '▼ 짐', flat: '● 유지', watch: '◎ 지켜볼 것', do: '✓ 할 일' };
UI.insSec = 'all';
function insights(){
  const I = (histSel && HIST.find(h => h.id === histSel)) || D.insights;
  if (!I) { view('<p class="empty">아직 분석 글이 없어요 · 월·목 아침 갱신 때 써요</p>'); return; }
  const secs = ['all', ...new Set((I.cards || []).map(c => c.section))];
  const cards = (I.cards || []).filter(c => UI.insSec === 'all' || c.section === UI.insSec);

    <div class="ins-head"><div><div class="when">${esc(when)} 분석 · ${esc(I.range || '')} 발행 글 · 추정 매출 기준</div><h2>${esc(I.headline || '')}</h2></div>
      ${HIST.length > 1 ? `<label class="when">지난 분석 <select data-hist aria-label="지난 분석 고르기">${HIST.map(h => `<option value="${esc(h.id)}"${(histSel || HIST[0].id) === h.id ? ' selected' : ''}>${esc(h.id)}</option>`).join('')}</select></label>` : ''}</div>
    ${(I.actions || []).length ? `<section class="todo"><h3>This Week — 누리가 할 일</h3><ol>${I.actions.map(a => `<li><b>${esc(a.text)}</b><span>${esc(a.why || '')}</span></li>`).join('')}</ol></section>` : ''}
    <div class="tools" style="margin-top:24px"><div class="seg" role="group" aria-label="분류">${secs.map(k => `<button class="${k === UI.insSec ? 'on' : ''}" data-insec="${k}">${k === 'all' ? 'All' : esc(SECT[k] || k)}</button>`).join('')}</div></div>
    <div class="icards">${cards.map(c => `<article class="icard v-${esc(c.verdict)}">

      <p class="sum" style="margin:0">${esc(c.summary)}</p>

      ${(c.refs || []).length ? `<div class="refs">${c.refs.map(r => `<button data-ref="${esc(r)}">${esc(r)} →</button>`).join('')}</div>` : ''}
    </article>`).join('')}</div>
    <p class="note">분석 글은 월·목 아침 갱신 때 Claude 가 이 페이지의 숫자만 보고 써요. 숫자는 추정이라 실제보다 낮게 나오는 편이에요.</p>`);
}

/* ───────── Peers — 누리 방식(주 1회 안팎·400P 이상·적게 써서 버는)으로 성공한 새 채널 */
UI.peerSort = 'estRev';
function peers(){
  const L = D.peers || [];
  if (!L.length) { view('<p class="empty">아직 자료가 없어요</p>'); return; }
  const k = UI.peerSort;
  const rows = [...L].sort((a, b) => (b[k] ?? -1) - (a[k] ?? -1));
  const fmtD = s => s ? s.slice(2).replace(/-/g, '.') : '—';
  const pill = (t, cls = '') => `<span class="chip ${cls}">${t}</span>`;
  const medAll = (f) => { const v = L.map(f).filter(x => x != null).sort((a, b) => a - b); return v.length ? v[v.length >> 1] : null; };
  view(`
    <div class="callout">2024년 이후 만든 채널 중 <b>글 간격 4일 이상 · 400~1,500P · 1년 추정 300만 원 이상</b>인 곳 ${L.length}곳이에요. 채널 전체 글(나페스 태그 없는 글까지)을 받아서 봤어요.</div>
    <div class="kpis">
      <div class="kpi"><div class="l">한 달에 올리는 글</div><div class="v num">${medAll(p => p.postsPerMonth) ?? '—'}편</div><div class="s">가운데값</div></div>
      <div class="kpi"><div class="l">첫 유료 전 무료 글</div><div class="v num">${medAll(p => p.freeBeforeFirstPaid) ?? '—'}편</div><div class="s">${L.filter(p => p.freeBeforeFirstPaid === 0).length}곳은 첫 글부터 유료</div></div>
      <div class="kpi"><div class="l">유료 글 중 19금</div><div class="v num">${medAll(p => p.adultPaidRatio) ?? '—'}%</div><div class="s">19금 절반 미만인 곳 ${L.filter(p => (p.adultPaidRatio ?? 100) < 50).length}곳</div></div>
      <div class="kpi"><div class="l">1만 자당 가격</div><div class="v num">${fmtN(medAll(p => p.pricePer10k && p.pricePer10k < 5000 ? p.pricePer10k : null))}P</div><div class="s">유료 글 글자 수 표본 기준</div></div>
    </div>
    <div class="tools" style="margin-top:20px"><div class="seg" role="group" aria-label="정렬">${[['estRev', '매출'], ['subscribers', '구독자'], ['postsPerMonth', '글 많은 순'], ['adultPaidRatio', '19금 비율']].map(([kk, l]) => `<button class="${kk === k ? 'on' : ''}" data-psort="${kk}">${l}</button>`).join('')}</div><span class="hint">X·질문함 링크가 있으면 바깥에서 데려온 독자가 있을 가능성이 커요</span></div>
    <div class="pcards">${rows.map(p => `<article class="pcard">
      <div class="ph"><a class="lnk" href="${chUrl(p.channelName)}" target="_blank" rel="noopener"><b>${esc(p.title)}</b></a><span class="sub">${esc(p.author || '')}${p.bio ? ' · ' + esc(p.bio.slice(0, 40)) : ''}</span></div>
      <div class="pstats">
        <div><span>1년 추정</span><b>${won(p.estRev)}</b></div><div><span>구독자</span><b>${fmtN(p.subscribers)}</b></div>
        <div><span>개설 · 첫 글</span><b>${fmtD(p.createdAt)} · ${fmtD(p.firstPost)}</b></div><div><span>전체 글</span><b>${fmtN(p.totalPosts)}편 · 월 ${p.postsPerMonth ?? '—'}편</b></div>
        <div><span>유료 / 무료</span><b>${fmtN(p.paidPosts)} / ${fmtN(p.freePosts)}</b></div><div><span>첫 유료 전</span><b>${p.freeBeforeFirstPaid ? '무료 ' + p.freeBeforeFirstPaid + '편 (' + p.daysToFirstPaid + '일)' : '첫 글부터 유료'}</b></div>
        <div><span>가격 · 간격</span><b>${p.medPrice ? fmtN(p.medPrice) + 'P' : '—'} · ${p.medGapDays ?? '—'}일</b></div><div><span>회당 글자</span><b>${p.medPaidChars ? fmtN(Math.round(p.medPaidChars)) + '자' : '—'}${p.pricePer10k && p.pricePer10k < 5000 ? ' · 1만 자 ' + fmtN(p.pricePer10k) + 'P' : ''}</b></div>
      </div>
      <div>${pill('유료 중 19금 ' + (p.adultPaidRatio ?? '—') + '%', (p.adultPaidRatio ?? 100) < 50 ? 'acc' : '')}${(p.people || []).slice(0, 4).map(x => pill(esc(x))).join('')}${(p.links || []).length ? pill('바깥 링크 ' + p.links.length + '개', 'acc') : ''}</div>
      <div class="pser">${(p.series || []).slice(0, 4).map(s => `<div><b>${esc(s.title)}</b> <span>${s.eps}편 · ${s.price ? fmtN(s.price) + 'P' : '무료'}${s.adult ? ' · 19' : ''} · ${won(s.estRev)}</span>${s.summary ? `<p>${esc(s.summary.slice(0, 90))}</p>` : ''}</div>`).join('')}</div>
      <div class="ptl" aria-label="글 올린 흐름">${spark((p.timeline || []).map(t => t[3]), { w: 300, h: 34, color: 'var(--accent)' })}<span class="sub">글마다 조회 · 왼쪽이 첫 글</span></div>
      ${(p.links || []).length ? `<div class="sub">${p.links.map(l => esc(String(l).replace(/^https?:\/\//, '').replace(/\?.*/, ''))).join(' · ')}</div>` : ''}
    </article>`).join('')}</div>`);
}

/* ───────── Overview */
function overview(){
  const m = D.meta, months = D.months;
  const full = months.slice(0, -1); // 마지막 달은 진행 중
  const totRev = months.reduce((s, x) => s + x.estRev, 0);
  const totCh = m.channelsTotal || D.authors.length;
  const paid = Math.round(months.reduce((s, x) => s + x.paidRatio * x.posts, 0) / Math.max(1, months.reduce((s, x) => s + x.posts, 0)));
  const W = windows();

/* ───────── 정렬 표 공통 */
function table(id, rows, cols, { rowClass, detail, keyOf } = {}){
  const st = UI.sort[id] || (UI.sort[id] = { k: cols.find(c => c.def)?.k || cols[1].k, asc: false });
  const col = cols.find(c => c.k === st.k);
  const sorted = [...rows].sort((a, b) => { const x = col.v(a), y = col.v(b); const r = (x == null) - (y == null) || (typeof x === 'string' ? x.localeCompare(y) : x - y); return st.asc ? r : -r; });
  const body = sorted.map(r => {
    const k = keyOf ? keyOf(r) : null, open = k != null && UI.open[id] === k;
    return `<tr class="${rowClass ? rowClass(r) : ''}${open ? ' open' : ''}" data-t="${id}" data-k="${esc(k)}">${cols.map(c => `<td class="${c.cls || ''}">${c.h(r)}</td>`).join('')}</tr>` +
      (open && detail ? `<tr class="detail"><td colspan="${cols.length}"><div class="dwrap">${detail(r)}</div></td></tr>` : '');
  }).join('');
  return `<div class="tblwrap"><table><thead><tr>${cols.map(c => `<th class="${c.cls || ''}${c.k === st.k ? ' on' + (st.asc ? ' asc' : '') : ''}" data-sort="${id}|${c.k}" title="${esc(c.tip || '')}">${c.t}</th>`).join('')}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}" class="empty">없어요</td></tr>`}</tbody></table></div>`;
}
document.getElementById('view').addEventListener('click', e => {
  const th = e.target.closest('[data-sort]');
  if (th) { const [id, k] = th.dataset.sort.split('|'); const s = UI.sort[id]; if (s.k === k) s.asc = !s.asc; else { s.k = k; s.asc = false; } render(); return; }
  const psb = e.target.closest('[data-psort]');
  if (psb) { UI.peerSort = psb.dataset.psort; render(); return; }
  const isb = e.target.closest('[data-insec]');
  if (isb) { UI.insSec = isb.dataset.insec; render(); return; }
  const rf = e.target.closest('[data-ref]');
  if (rf) { const k = rf.dataset.ref; const has = (L) => (L || []).some(x => x.key === k);
    const au = D.authors.find(a => a.channelName === k || a.title === k);
    if (au && !has(D.people)) { UI.q.authors = au.title; tab = 'authors'; render(); window.scrollTo(0, 0); return; }
    UI.idolMode = has(D.people) ? 'people' : has(D.units) ? 'units' : has(D.groups) ? 'groups' : has(D.themes) ? 'themes' : has(D.keywords) ? 'keywords' : 'people';
    UI.q.idols = k; UI.open.idols = k; tab = 'idols'; render(); window.scrollTo(0, 0); return; }
  const pb = e.target.closest('[data-period],[data-metric]');
  if (pb) { if (pb.dataset.period) UI.period = pb.dataset.period; if (pb.dataset.metric) UI.metric = pb.dataset.metric; try { localStorage.setItem('atelier_pmkt_period', UI.period); localStorage.setItem('atelier_pmkt_metric', UI.metric); } catch (e) {} render(); return; }
  const seg = e.target.closest('[data-mode]');
  if (seg) { UI.idolMode = seg.dataset.mode; UI.open.idols = null; render(); return; }
  if (e.target.closest('a')) return;
  const tr = e.target.closest('tr[data-t]');
  if (tr && tr.dataset.k !== '') { const id = tr.dataset.t; UI.open[id] = UI.open[id] === tr.dataset.k ? null : tr.dataset.k; render(); }
});
document.getElementById('view').addEventListener('change', e => { if (e.target.matches('[data-hist]')) { histSel = e.target.value; render(); } });
document.getElementById('view').addEventListener('input', e => {
  if (e.target.matches('[data-q]')) { UI.q[e.target.dataset.q] = e.target.value; const pos = e.target.selectionStart; render(); const el = document.querySelector(`[data-q="${e.target.dataset.q}"]`); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});

/* ───────── Playbook — 잘 버는 작가들은 어떻게 하나 */

      </div>
    </section>
    <section class="sec">
      <div class="sech"><h2>Length</h2><p>글자 수는 공백 빼고 · 회차 몇 편씩 표본</p></div>
      <div class="kpis" style="margin-top:0">
        ${k('회당 글자 수', S.charsPerEp, kChars, '자')}
        ${k('유료 회당 글자 수', S.paidCharsPerEp, kChars, '자')}
        ${k('1만 자당 가격', S.pricePer10k, fmtN, 'P')}
        ${k('시리즈 총 글자 수', S.totalChars, v => fmtK(v), '자')}
      </div>
      <p class="note">내 기준(약 1만 자 500P)과 비교해 보세요. 화수 가운데값은 ${S.eps.med ?? '—'}화(가운데 50% ${S.eps.p25 ?? '—'}~${S.eps.p75 ?? '—'}화).</p>
    </section>
    ${S.adultMix ? `<section class="sec card"><div class="sech"><h2>Scenes</h2><p>유료 시리즈(8화 이상)를 회차마다 붙은 19금 표시로 나눔 · 19금 표시는 작가가 성인 인증을 건 회차</p></div>
      <div class="scn">${[['all', '전부 19금'], ['part', '필요한 회차만 19금'], ['none', '19금 없음']].map(([k, l]) => { const g = S.adultMix[k]; return `<div class="scard">
        <div class="l">${l}</div><div class="v num">${g.revShare}%</div><div class="s">매출 점유 · 시리즈 ${g.n}개(${g.seriesShare}%) · 시리즈당 ${won(g.revMed)}</div>
        ${g.examples.map(x => `<div class="ex"><a class="lnk" href="${chUrl(x.channelName)}/series/${x.id}" target="_blank" rel="noopener">${esc(x.title)}</a><span class="sub">${esc(x.channel)} · ${x.eps}화 · 19금 ${x.adultEpRatio}% · ${x.price}P</span><div class="ptn">${String(x.pattern).split('').map(c => `<i class="${c === '1' ? 'on' : ''}"></i>`).join('')}</div></div>`).join('')}
      </div>`; }).join('')}</div><p class="note">작은 칸 하나가 한 화예요(앞 30화). 진한 칸이 19금 회차.</p></section>` : ''}
    <section class="sec grid2">
      <div class="card"><div class="sech"><h2>Cadence</h2><p>연재 간격 가운데값 ${S.gapDays.med ?? '—'}일 (가운데 50% ${S.gapDays.p25 ?? '—'}~${S.gapDays.p75 ?? '—'}일)</p></div>
        <h3 style="font-size:12.5px;color:var(--ink2);margin:6px 0">유료 시리즈가 주로 올라오는 요일</h3>${cols(S.weekday, WD)}
        <h3 style="font-size:12.5px;color:var(--ink2);margin:14px 0 6px">시각</h3>${cols(S.hour, S.hour.map((_, i) => i % 3 === 0 ? String(i) : ''), 110)}</div>
      <div class="card"><div class="sech"><h2>One Group or Many</h2><p>유료 글 10편 이상 채널 · 가장 많이 쓰는 그룹 비율로 나눔</p></div>
        <div class="tblwrap"><table><thead><tr><th>한 그룹 비율</th><th>채널</th><th>글당 매출</th><th>채널당 1년</th><th>구독자</th></tr></thead><tbody>${fbRows}</tbody></table></div>
        <p class="note">잘 버는 상위 ${S.topN}곳의 한 그룹 비율 가운데값은 ${S.focus.med ?? '—'}%예요.</p>
        ${mine.length ? `<p class="note">내 채널: ${mine.map(a => `${esc(a.title)} — ${esc(a.topGroup || '—')} ${a.focus ?? '—'}%`).join(' · ')}</p>` : ''}
      </div>
    </section>
    <section class="sec grid2">
      <div class="card"><div class="sech"><h2>New Pen Name?</h2><p>채널 개설 시기 — 상위 ${S.topN}곳</p></div>
        ${barList(Object.entries(S.created).sort((a, b) => a[0].localeCompare(b[0])).map(([y, n]) => ({ y, n })), { val: r => r.n, label: r => r.y + '년', fmt: v => v + '곳' })}
        <p class="note">최근 18달(${esc(S.fresh.cutoff)}~) 안에 만든 채널 ${fmtN(S.fresh.n)}곳: 1년 추정 매출 가운데값 ${won(S.fresh.revMed)}, 상위 10% ${won(S.fresh.revP90)} · 구독자 가운데값 ${fmtN(S.fresh.subsMed)}, 상위 10% ${fmtN(S.fresh.subsP90)}</p>
        ${S.freshInTop.length ? `<h3 style="font-size:12.5px;color:var(--ink2);margin:12px 0 6px">상위권에 든 새 채널</h3><ol style="margin:0;padding-left:18px">${S.freshInTop.map(a => `<li><a class="lnk" href="${chUrl(a.channelName)}" target="_blank" rel="noopener">${esc(a.title)}</a> <span style="color:var(--ink2)">· ${esc(a.createdAt)} 개설 · ${esc(a.topGroup || '')} · 구독 ${fmtK(a.subscribers)} · ${won(a.estRev)}</span></li>`).join('')}</ol>` : ''}
      </div>
      <div class="card"><div class="sech"><h2>Multi-Channel Authors</h2><p>한 작가가 채널을 둘 이상 굴리는 경우 ${fmtN(S.multiCount)}명 (작가 정보 확인된 ${fmtN(S.profilesKnown)}명 중)</p></div>
        ${S.multi.length ? `<ol style="margin:0;padding-left:18px">${S.multi.slice(0, 15).map(m => `<li style="margin:6px 0"><b>${esc(m.author)}</b> <span style="color:var(--ink2)">· ${won(m.estRev)} · ${m.sameGroup ? '같은 그룹' : '그룹 나눔'}</span><br>${m.channels.map(c => `<span class="chip">${esc(c.title)} · ${esc(c.topGroup || '—')} · ${fmtK(c.subscribers)}</span>`).join('')}</li>`).join('')}</ol>` : '<p class="empty">자료 모으는 중</p>'}
      </div>
    </section>
  `);
}

/* ───────── Authors */
function authors(){
  const rows = qf('authors', D.authors, r => r.title + ' ' + r.author + ' ' + r.channelName + ' ' + r.people.join(' '));
  const cols = [
    { k: 'title', t: '채널', cls: 'l c-title', v: r => r.title, h: r => `<a class="lnk tt" href="${chUrl(r.channelName)}" target="_blank" rel="noopener">${esc(r.title)}</a><span class="ch">${esc(r.author || '')}</span>` },
    { k: 'estRev', t: '1년 매출', def: true, v: r => r.estRev, h: r => won(r.estRev) },
    { k: 'subs', t: '구독자', v: r => r.subscribers, h: r => fmtN(r.subscribers) },
    { k: 'posts', t: '글', v: r => r.posts, h: r => fmtN(r.posts) },
    { k: 'paid', t: '유료 글', v: r => r.paidPosts, h: r => fmtN(r.paidPosts) },
    { k: 'price', t: '가격', v: r => r.medPrice, h: r => r.medPrice ? fmtN(r.medPrice) + 'P' : '—' },
    { k: 'likes', t: '좋아요', v: r => r.likes, h: r => fmtK(r.likes) },
    { k: 'gap', t: '발행 간격', tip: '글 사이 간격 가운데값(일)', v: r => r.medGapDays, h: r => r.medGapDays == null ? '—' : r.medGapDays + '일' },
    { k: 'maxgap', t: '최장 공백', v: r => r.maxGapDays, h: r => r.maxGapDays == null ? '—' : Math.round(r.maxGapDays) + '일' },
    { k: 'last', t: '마지막 글', v: r => r.lastPost, h: r => esc(r.lastPost.slice(2)) },
    { k: 'ppl', t: '주력', v: r => r.people.join(','), h: r => `<span class="tags">${r.people.map(p => `<i class="tg p">${esc(p)}</i>`).join('')}</span>`, cls: 'l c-tags' },
    { k: 'mr', t: '월별 매출', v: r => r.estRev, h: r => spark(r.monthlyRev, { w: 110, h: 28 }), cls: 'l' },
  ];
  view(`<div class="sec">${search('authors', '채널·작가·인물 찾기', `매출 추정 상위 ${D.authors.length}개 채널 · 굵은 바탕은 내 채널`)}
    ${table('authors', rows, cols, { rowClass: r => r.mine ? 'mine' : '' })}</div>`);
}

/* ───────── Series */
function series(){
  const rows = qf('series', D.series, r => r.title + ' ' + r.channelTitle + ' ' + r.people.join(' ') + ' ' + r.themes.join(' '));
  const cols = [
    { k: 'title', t: '시리즈', cls: 'l c-title', v: r => r.title, h: r => `<a class="lnk tt" href="${seriesUrl(r)}" target="_blank" rel="noopener">${esc(r.title)}</a><span class="ch">${esc(r.channelTitle)}</span>${r.people.length || r.themes.length ? `<span class="tags">${r.people.slice(0, 3).map(p => `<i class="tg p">${esc(p)}</i>`).join('')}${r.themes.slice(0, 2).map(p => `<i class="tg">${esc(p)}</i>`).join('')}</span>` : ''}` },
    { k: 'estRev1y', t: '최근 1년', def: true, tip: '보관 기간(최근 13개월) 안에 올린 회차의 추정 매출', v: r => r.estRev1y, h: r => `<b class="money">${won(r.estRev1y)}</b><span class="ch">${fmtN(r.eps1y)}화</span>` },
    { k: 'estRev', t: '누적', tip: '연재 시작부터 모든 회차의 추정 매출', v: r => r.estRev, h: r => `${won(r.estRev)}<span class="ch">${fmtN(r.eps)}화</span>` },
    { k: 'start', t: '연재', v: r => r.start, h: r => `${esc(r.start.slice(2).replace(/-/g, '.'))}~<span class="ch">${r.daysSinceLast <= 14 ? '<b class="live">연재 중</b>' : r.daysSinceLast + '일 전 마지막'}</span>` },
    { k: 'gap', t: '주기', v: r => r.medGapDays, h: r => `${r.medGapDays == null ? '—' : r.medGapDays + '일마다'}<span class="ch">${r.weekday == null ? '' : WD[r.weekday] + ' ' + r.hour + '시'}</span>` },
    { k: 'price', t: '가격', v: r => r.medPrice, h: r => `${r.medPrice ? fmtN(r.medPrice) + 'P' : '무료'}<span class="ch">무료 ${r.firstPaidEp ? (r.firstPaidEp - 1) + '화' : '전부'}</span>` },
    { k: 'ret', t: '유지율', tip: '마지막 화 조회 ÷ 1화 조회', v: r => r.retention, h: r => pct(r.retention) },
    { k: 'curve', t: '회차별 조회', cls: 'l', v: r => r.views, h: r => spark(r.curve.map(c => c[0]), { w: 120, h: 30 }) },
  ];
  view(`<div class="sec">${search('series', '시리즈·인물·결 찾기', `회차 전체를 받은 시리즈 ${D.series.length}개 · '최근 1년'은 이 기간에 올린 회차만, '누적'은 연재 시작부터 전부`)}
    ${table('series', rows, cols, { rowClass: r => r.mine ? 'mine' : '' })}</div>`);
}

/* ───────── Me vs Market */
function me(){
  const ranked = [...D.authors];
  const mine = MY.map(n => ({ n, a: ranked.find(x => x.channelName === n), rank: ranked.findIndex(x => x.channelName === n) + 1 }));
  const mySeries = D.series.filter(s => s.mine);
  const paidSeries = D.series.filter(s => s.medPrice && s.eps >= 8);
  const med = (arr) => { const s = arr.filter(x => x != null).sort((a, b) => a - b); return s.length ? s[s.length >> 1] : null; };
  const mk = { free: med(paidSeries.map(s => s.firstPaidEp && s.firstPaidEp - 1)), price: med(paidSeries.map(s => s.medPrice)), ret: med(paidSeries.map(s => s.retention)), gap: med(paidSeries.map(s => s.medGapDays)), eps: med(paidSeries.map(s => s.eps)) };
  const wd = {}; for (const s of paidSeries.slice(0, 100)) if (s.weekday != null) wd[s.weekday] = (wd[s.weekday] || 0) + 1;
  const wdTop = Object.entries(wd).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, n]) => WD[k] + ' ' + n);
  const riku = D.people.find(p => p.key === '리쿠'), bh = D.people.find(p => p.key === '변백현');
  view(`
    <div class="kpis">
      ${mine.map(({ n, a, rank }) => `<div class="kpi"><div class="l">${n === 'bichu-attic' ? '고요한 다락방' : '요란한 옥탑방'}</div><div class="v num">${a ? rank + '위' : '—'}</div><div class="s">${a ? '이 기간 추정 매출 ' + won(a.estRev) + ' · 채널 ' + fmtN(D.authors.length) + '곳 중' : '이 기간 나페스 글 없음'}</div></div>`).join('')}
      <div class="kpi"><div class="l">리쿠 시장</div><div class="v num">${riku ? won(last3rev(riku)) : '—'}</div><div class="s">${riku ? '최근 3달 · 단독 글 ' + fmtN(riku.soloPosts) + ' / 전체 ' + fmtN(riku.posts) + ' · 상위3 독점 ' + pct(riku.top3Share) : ''}</div></div>
      <div class="kpi"><div class="l">백현 시장</div><div class="v num">${bh ? won(last3rev(bh)) : '—'}</div><div class="s">${bh ? '최근 3달 · 작가 ' + fmtN(bh.channels) + '명 · 상위3 독점 ' + pct(bh.top3Share) : '이 기간 글 적음'}</div></div>
    </div>
    <section class="sec card">
      <div class="sech"><h2>잘 팔리는 유료 시리즈의 보통값</h2><p>회차 전체를 받은 유료 시리즈(8화 이상) ${paidSeries.length}개 가운데값</p></div>
      <div class="kpis" style="margin-top:0">
        <div class="kpi"><div class="l">무료 화수</div><div class="v num">${mk.free ?? '—'}화</div><div class="s">내 시리즈는 보통 3~4화</div></div>
        <div class="kpi"><div class="l">회당 가격</div><div class="v num">${mk.price ? fmtN(mk.price) + 'P' : '—'}</div><div class="s">내 시리즈 500P</div></div>
        <div class="kpi"><div class="l">유지율</div><div class="v num">${pct(mk.ret)}</div><div class="s">마지막 화 ÷ 1화</div></div>
        <div class="kpi"><div class="l">발행 간격</div><div class="v num">${mk.gap ?? '—'}일</div><div class="s">자주 쓰는 요일 ${esc(wdTop.join(' · '))}</div></div>
      </div>
    </section>
    <section class="sec">
      <div class="sech"><h2>내 시리즈</h2><p>이번 수집에 걸린 것만</p></div>
      ${mySeries.length ? table('myseries', mySeries, [
        { k: 'title', t: '시리즈', v: r => r.title, h: r => `<a class="lnk" href="${seriesUrl(r)}" target="_blank" rel="noopener"><b>${esc(r.title)}</b></a><span class="sub">${esc(r.channelTitle)}</span>` },
        { k: 'estRev', t: '추정 매출', def: true, v: r => r.estRev, h: r => won(r.estRev) },
        { k: 'eps', t: '화수', v: r => r.eps, h: r => r.eps },
        { k: 'ret', t: '유지율', v: r => r.retention, h: r => pct(r.retention) },
        { k: 'curve', t: '회차별 조회', v: r => r.views, h: r => spark(r.curve.map(c => c[0]), { w: 160, color: 'var(--accent)' }), cls: 'l' },
      ]) : '<p class="empty">이 기간 내 시리즈가 나페스 검색에 안 걸렸어요</p>'}
    </section>
    <section class="sec">
      <div class="sech"><h2>추정이 얼마나 맞나</h2><p>내 시리즈: 이 페이지 방식의 추정 vs 스튜디오 실제 매출(lifetime)</p></div>
      ${(D.check || []).length ? `<div class="tblwrap"><table><thead><tr><th>시리즈</th><th>추정</th><th>실제</th><th>차이</th></tr></thead><tbody>${D.check.map(c => `<tr><td><b>${esc(c.series)}</b><span class="sub">${c.channelName === 'bichu-attic' ? '고요한 다락방' : '요란한 옥탑방'}</span></td><td>${won(c.est)}</td><td>${won(c.actual)}</td><td>${c.actual ? gw(100 * (c.est - c.actual) / c.actual) : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">비교할 내 시리즈가 없어요</p>'}
      <p class="note">추정 = 유료 글 조회 × 가격 × 구매율(단건 ${Math.round(D.meta.buyRate.single * 100)}% · 묶음 ${Math.round(D.meta.buyRate.bundle * 100)}%). 실제보다 낮게 나오면 시장 숫자도 '최소 이만큼'으로 읽으면 돼요.</p>
    </section>
  `);
}

/* ───────── 시작 */
if (LOCAL) load();
else auth.onAuthStateChanged(user => {
  if (!user || user.email !== ALLOWED_EMAIL) { view('<p class="empty">메인 화면에서 로그인하면 보여요</p>'); return; }
  load();
});
</script>
</body>
</html>
