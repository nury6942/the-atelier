<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Trends</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 매일 카드뉴스 — 아이맥 launchd(com.nuri.card-news-weekly)가 매일 06:30 만들어 data/card-news/ 에 커밋(45일 보관).
     만드는 곳: ~/tools/instagram-card-news/weekly (run.sh · publish.js). 이 페이지는 index.json · meta.json 만 읽는다. */
  :root{
    --ink:#111; --paper:#fff; --wash:#F5F5F7; --line:#ECECF0; --line2:#D9D9E0;
    --mut:#475569; --accent:#1F4BD8; --accent-dark:#1A3FB5; --accent-wash:#EEF2FD; --err:#b42318;
    --card:clamp(220px, 26vw, 300px);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Pretendard','-apple-system',BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;
    word-break:keep-all;overflow-wrap:break-word}
  a{color:inherit}
  button{font:inherit;cursor:pointer;color:inherit}
  /* 머리 = AI Brief 와 같은 틀(ai-brief.html .mast·.seg·.days·.sech) — 세 페이지(AI Brief·Trends·Job Hunt) 제목 크기·선·위치 통일 */
  .wrap{max-width:1180px;margin:0 auto;padding:36px 24px 96px}
  .mast{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
  .mast h1{margin:0;font-size:2.6rem;font-weight:800;font-style:italic;letter-spacing:-.035em;line-height:.9;text-transform:uppercase}
  .seg{display:flex;border:1px solid var(--ink)}
  .seg a{text-decoration:none;padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink)}
  .seg a+a{border-left:1px solid var(--ink)}
  .seg a.on{background:var(--ink);color:var(--paper)}
  .days{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .days button{flex:none;border:1px solid var(--line);background:var(--paper);padding:6px 10px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--mut)}
  .days button:hover{border-color:var(--ink);color:var(--ink)}
  .days button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}

  section.deck{scroll-margin-top:12px}
  .sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:10px;margin:56px 0 20px}
  .sech h2{margin:0;font-size:1.35rem;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:-.015em}
  .sech .cap{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);white-space:nowrap}

  .strip{display:grid;grid-auto-flow:column;grid-auto-columns:var(--card);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin}
  .strip button{all:unset;cursor:zoom-in;scroll-snap-align:start;display:block;position:relative}
  .strip img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--wash);border:1px solid var(--line);transition:transform .18s ease,border-color .18s ease}
  .strip button:hover img,.strip button:focus-visible img{transform:translateY(-3px);border-color:var(--line2)}
  .strip button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  details.src{margin-top:4px;font-size:13px;color:var(--mut)}
  details.src summary{cursor:pointer;font-weight:600;padding:6px 0;list-style:none}
  details.src summary::-webkit-details-marker{display:none}
  details.src summary::before{content:'+ '}
  details.src[open] summary::before{content:'– '}
  details.src ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  details.src li a{display:inline-block;border:1px solid var(--line2);padding:4px 9px;font-size:12px;font-weight:600;color:var(--mut);text-decoration:none}
  details.src li a:hover{border-color:var(--accent);color:var(--accent)}

  /* 자세히 장 = 이야기 카드 바로 다음 장. 카드와 같은 4:5 · 같은 바탕·포인트 색(분야별 렌더 스타일, weekly/run.sh 의 STYLE·ACCENT 와 맞춤)
     글자 크기는 카드 폭 기준(cqw) — PNG 카드(1080px)와 같은 비율로 커지고 작아진다 */
  .dcard{--z:1;--bg:#fff;--fg:#1a1a1a;--sub:#475569;--acc:#1F4BD8;--mark:var(--acc);
    position:relative;aspect-ratio:4/5;width:100%;container-type:inline-size;scroll-snap-align:start;background:var(--bg);color:var(--fg);
    border:1px solid var(--line);cursor:zoom-in;overflow:hidden;font-family:'Pretendard','Apple SD Gothic Neo',sans-serif}
  .dcard.th-clean{--bg:#F0F0F0}
  .dcard.th-blueprint{--bg:#EDF0F5}
  .dcard .in{position:absolute;inset:0;padding:calc(7.4cqw * var(--z)) calc(7.4cqw * var(--z)) calc(6.5cqw * var(--z));display:flex;flex-direction:column;gap:calc(2.4cqw * var(--z))}
  .dcard .top{display:flex;justify-content:space-between;align-items:center;font-size:calc(2.4cqw * var(--z));font-weight:600;color:var(--sub);margin:calc(-2.6cqw * var(--z)) 0 calc(1cqw * var(--z))}
  .dcard .top .ac::before{content:'';display:inline-block;width:calc(1.5cqw * var(--z));height:calc(1.5cqw * var(--z));border-radius:50%;background:var(--acc);margin-right:calc(1cqw * var(--z));vertical-align:.1em}
  .dcard .top .k{color:var(--mark);font-weight:800;letter-spacing:.14em}
  .dcard .ph{display:block;width:100%;max-height:36%;object-fit:contain;object-position:center;background:rgba(0,0,0,.04);flex:none}
  .dcard h3{margin:calc(.6cqw * var(--z)) 0 0;font-size:calc(5.4cqw * var(--z));font-weight:800;letter-spacing:-.03em;line-height:1.28}
  .dcard .d{font-size:calc(2.5cqw * var(--z));font-weight:600;color:var(--sub);margin-top:calc(-1.4cqw * var(--z));font-variant-numeric:tabular-nums}
  .dcard ul{list-style:none;margin:calc(.4cqw * var(--z)) 0 0;padding:0;display:flex;flex-direction:column;gap:calc(1.7cqw * var(--z))}
  .dcard li{position:relative;padding-left:calc(3.4cqw * var(--z));font-size:calc(3.2cqw * var(--z));line-height:1.5;font-weight:500}
  .dcard li::before{content:'';position:absolute;left:0;top:.6em;width:calc(1.4cqw * var(--z));height:calc(1.4cqw * var(--z));background:var(--acc)}
  .dcard strong{font-weight:800;color:var(--mark)}
  .dcard.th-clean strong{color:var(--fg);background:linear-gradient(transparent 58%, color-mix(in srgb, var(--acc) 55%, transparent) 58%)}
  .dcard .why{margin-top:auto;background:color-mix(in srgb, var(--acc) 11%, var(--bg));padding:calc(2.4cqw * var(--z)) calc(2.8cqw * var(--z));font-size:calc(3cqw * var(--z));line-height:1.5;font-weight:700}
  .dcard.th-clean .why{background:#fff}
  .dcard .why b{color:var(--mark);margin-right:calc(1cqw * var(--z))}
  .dcard .lk{display:flex;flex-wrap:wrap;gap:calc(.6cqw * var(--z)) calc(2.4cqw * var(--z));font-size:calc(2.3cqw * var(--z));font-weight:600}
  .dcard .lk a{color:var(--sub);text-underline-offset:2px}
  .dcard .lk a:hover{color:var(--fg)}
  .dcard.th-clean{--mark:#4F7A1F}
  .lb .dcard{width:min(92vw, 92dvh * .8);height:auto;cursor:default;border:0}

  .state{padding:64px 0;text-align:center;font-size:14px;color:var(--mut)}
  .state.err{color:var(--err)}

  /* 크게 보기 */
  .lb{position:fixed;inset:0;background:rgba(10,10,12,.92);display:none;align-items:center;justify-content:center;z-index:50}
  .lb.on{display:flex}
  .lb > img{max-height:92dvh;max-width:92vw;aspect-ratio:4/5;object-fit:contain;display:block}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.12);color:#fff;width:52px;height:52px;font-size:26px;line-height:1}
  .lb .nav:hover{background:rgba(255,255,255,.24)}
  .lb .prev{left:18px} .lb .next{right:18px}
  .lb .x{position:absolute;top:14px;right:16px;border:0;background:none;color:#fff;font-size:30px;line-height:1;padding:6px 10px}
  .lb .cnt{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}

  @media (max-width:860px){
    .wrap{padding:22px 14px 72px}
    .mast h1{font-size:2rem}
    .seg{width:100%}
    .seg a{flex:1;text-align:center;padding:8px 0}
    .sech .cap{display:none}
    :root{--card:72vw}
    .strip{margin:0 -14px;padding:0 14px 12px;scroll-padding:0 14px}
    .lb .nav{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1>Trends</h1>
    <nav class="seg" id="jump"></nav>
  </header>
  <div class="days" id="weeks"></div>
  <div id="decks"><div class="state" id="state">불러오는 중…</div></div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="카드 크게 보기">
  <button class="x" id="lbx" aria-label="닫기">×</button>
  <button class="nav prev" id="lbp" aria-label="이전">‹</button>
  <button class="nav next" id="lbn" aria-label="다음">›</button>
  <div class="cnt" id="lbc"></div>
</div>

<script>
(function(){
  var BASE = './data/card-news/';
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var bust = '?t=' + Math.floor(Date.now() / 600000);
  var idx = null, cur = null, lb = { list:[], i:0 };

  function fmt(w){ var d = new Date(w + 'T00:00:00'); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }
  function chip(w){
    var d = new Date(w + 'T00:00:00'), t = new Date(); t.setHours(0,0,0,0);
    var dow = '일월화수목금토'.charAt(d.getDay());
    var p2 = function(n){ return (n < 10 ? '0' : '') + n; };
    return p2(d.getMonth() + 1) + '.' + p2(d.getDate()) + ' ' + dow; // AI Brief 날짜 칩과 같은 꼴
  }

  function paintWeeks(){
    $('weeks').innerHTML = idx.weeks.slice(0, 14).map(function(w){
      return '<button data-w="' + esc(w.week) + '" class="' + (w.week === cur ? 'on' : '') + '" title="' + esc(fmt(w.week)) + '">' + esc(chip(w.week)) + '</button>';
    }).join('');
  }

  // 카드 순서에 「자세히」 판을 끼운다: 이야기의 slide 번호 카드 바로 뒤
  function seq(t){
    var out = [], by = {};
    var ss = t.stories || [], hasN = ss.some(function(st){ return st.slide; });
    // 카드 번호가 없는 옛 데이터: 이야기 순서대로 2장부터 하나씩
    ss.forEach(function(st, k){ var n = hasN ? st.slide : Math.min(k + 2, t.slides.length - 1); if (n) (by[n] = by[n] || []).push(st); });
    t.slides.forEach(function(s, i){ out.push({ kind:'img', s:s, n:i + 1 }); (by[i + 1] || []).forEach(function(st){ out.push({ kind:'detail', st:st }); }); });
    return out;
  }
  function bold(x){ return esc(x).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
  // 카드 양식 — weekly/run.sh 의 STYLE·ACCENT 와 같게 (11/5부터 모든 분야 minimal + 코발트 하나. 옛 날짜도 같은 모양으로 보임)
  var THEME = { travel:['minimal','#1F4BD8'], fashion:['minimal','#1F4BD8'], society:['minimal','#1F4BD8'], news:['minimal','#1F4BD8'] };
  function detailHtml(x, tid, j){
    var th = THEME[tid] || ['minimal','#1F4BD8'];
    var pts = (x.points && x.points.length ? x.points : [x.summary]).map(function(p){ return '<li>' + bold(p) + '</li>'; }).join('');
    return '<div class="dcard th-' + th[0] + '" style="--acc:' + th[1] + '"' + (j != null ? ' data-t="' + esc(tid) + '" data-j="' + j + '"' : '') + '><div class="in">' +
      '<div class="top"><span class="ac">nuri_brief</span><span class="k">자세히</span></div>' +
      (x.image ? '<img class="ph" src="' + esc(x.image) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
      '<h3>' + esc(x.title) + '</h3>' + (x.date ? '<div class="d">' + esc(x.date) + '</div>' : '') +
      '<ul>' + pts + '</ul>' + (x.why ? '<div class="why"><b>그래서</b>' + esc(x.why) + '</div>' : '') +
      (x.sources && x.sources.length ? '<div class="lk">' + x.sources.map(function(q){ return '<a href="' + esc(q.url) + '" target="_blank" rel="noopener">' + esc(q.name) + '</a>'; }).join('') + '</div>' : '') +
      '</div></div>';
  }

  // 자세히 장: 글이 넘치면 그 장만 글자를 줄인다(사진 먼저 작게) — 카드 크기는 그대로
  function fit(root){
    [].forEach.call((root || document).querySelectorAll('.dcard'), function(c){
      var inn = c.querySelector('.in'), z = 1, ph = c.querySelector('.ph');
      c.style.setProperty('--z', 1); if (ph) ph.style.maxHeight = '';
      if (!inn.clientHeight) return;
      if (ph && inn.scrollHeight > inn.clientHeight + 1) ph.style.maxHeight = '26%';
      while (inn.scrollHeight > inn.clientHeight + 1 && z > 0.66) { z -= 0.03; c.style.setProperty('--z', z.toFixed(2)); }
    });
  }
  var fitT; function refit(){ clearTimeout(fitT); fitT = setTimeout(function(){ fit(); }, 80); }
  window.addEventListener('resize', refit);
  document.addEventListener('load', function(e){ if (e.target.classList && e.target.classList.contains('ph')) refit(); }, true);

  function load(week){
    cur = week; paintWeeks();
    $('decks').innerHTML = '<div class="state">불러오는 중…</div>';
    fetch(BASE + week + '/meta.json' + bust).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(m){
        if (cur !== week) return;
        $('jump').innerHTML = m.topics.map(function(t, i){ return '<a href="#d-' + esc(t.id) + '" class="' + (i ? '' : 'on') + '">' + esc(t.name) + '</a>'; }).join('');
        $('decks').innerHTML = m.topics.map(function(t){
          var imgs = seq(t).map(function(it, j){
            if (it.kind === 'img') return '<button data-t="' + esc(t.id) + '" data-j="' + j + '" aria-label="' + esc(t.name + ' ' + (it.n) + '장: ' + it.s.headline) + '">' +
              '<img src="' + BASE + esc(week + '/' + it.s.img) + '" alt="' + esc(it.s.headline) + '" loading="lazy" width="1080" height="1350"></button>';
            return detailHtml(it.st, t.id, j);
          }).join('');
          var src = t.sources && t.sources.length ? '<details class="src"><summary>출처 ' + t.sources.length + '곳</summary><ul>' +
            t.sources.map(function(s){ return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.host) + '</a></li>'; }).join('') + '</ul></details>' : '';
          return '<section class="deck" id="d-' + esc(t.id) + '"><div class="sech"><h2>' + esc(t.title) + '</h2>' +
            '<span class="cap">' + esc(t.name) + ' · ' + t.slides.length + '장 →</span></div><div class="strip">' + imgs + '</div>' + src + '</section>';
        }).join('');
        window._cn = m;
        spy(); fit();
      })
      .catch(function(e){ $('decks').innerHTML = '<div class="state err">이번 주 카드를 불러오지 못했어요 (' + esc(e.message) + ')</div>'; });
  }

  // 지금 보고 있는 분야를 위 탭에 표시
  function spy(){
    var secs = [].slice.call(document.querySelectorAll('section.deck'));
    if (!('IntersectionObserver' in window) || !secs.length) return;
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if (e.isIntersecting) [].forEach.call($('jump').children, function(a){ a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id); }); });
    }, { rootMargin:'-12% 0px -80% 0px' });
    secs.forEach(function(s){ io.observe(s); });
  }

  function openLb(tid, j){
    var t = (window._cn.topics || []).filter(function(x){ return x.id === tid; })[0]; if (!t) return;
    lb.name = t.name; lb.tid = t.id; lb.list = seq(t); lb.i = j; showLb(); $('lb').classList.add('on'); $('lbx').focus();
  }
  function showLb(){
    var it = lb.list[lb.i], old = $('lbi'); if (old) old.remove();
    var el;
    if (it.kind === 'img') { el = document.createElement('img'); el.src = BASE + cur + '/' + it.s.img; el.alt = it.s.headline; }
    else { var w = document.createElement('div'); w.innerHTML = detailHtml(it.st, lb.tid); el = w.firstChild; }
    el.id = 'lbi'; $('lb').insertBefore(el, $('lbn')); if (it.kind !== 'img') { fit($('lb')); var p = el.querySelector('.ph'); if (p) p.onload = function(){ fit($('lb')); }; }
    var cards = lb.list.filter(function(x){ return x.kind === 'img'; }).length;
    $('lbc').textContent = lb.name + ' · ' + (it.kind === 'img' ? it.n + ' / ' + cards : '자세히');
  }
  function step(d){ lb.i = (lb.i + d + lb.list.length) % lb.list.length; showLb(); }
  function closeLb(){ $('lb').classList.remove('on'); }

  $('weeks').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b && b.dataset.w !== cur) load(b.dataset.w); });
  $('decks').addEventListener('click', function(e){ if (e.target.closest('a')) return; var b = e.target.closest('.strip button, .strip .dcard'); if (b) openLb(b.dataset.t, +b.dataset.j); });
  $('lbp').onclick = function(){ step(-1); }; $('lbn').onclick = function(){ step(1); }; $('lbx').onclick = closeLb;
  $('lb').addEventListener('click', function(e){ if (e.target === $('lb')) closeLb(); });
  document.addEventListener('keydown', function(e){
    if (!$('lb').classList.contains('on')) return;
    if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
  });
  var tx = null;
  $('lb').addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; }, { passive:true });
  $('lb').addEventListener('touchend', function(e){ if (tx == null) return; var dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); tx = null; });

  fetch(BASE + 'index.json' + bust).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){
      idx = j; if (!idx.weeks || !idx.weeks.length) throw new Error('아직 만든 주가 없어요');
      load(idx.weeks[0].week); // 늘 최신 날짜부터 (지난 날짜는 위 날짜 띠로)
    })
    .catch(function(e){ $('state').className = 'state err'; $('state').textContent = '카드뉴스 목록을 불러오지 못했어요 (' + e.message + ')'; });
})();
</script>
</body>
</html>
