<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Trends</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 주간 카드뉴스 — 아이맥 launchd(com.nuri.card-news-weekly)가 매주 월 07:00 만들어 data/card-news/ 에 커밋.
     만드는 곳: ~/tools/instagram-card-news/weekly (run.sh · publish.js). 이 페이지는 index.json · meta.json 만 읽는다. */
  :root{
    --ink:#111; --paper:#fff; --wash:#F5F5F7; --line:#ECECF0; --line2:#D9D9E0;
    --mut:#475569; --accent:#1F4BD8; --accent-dark:#1A3FB5; --accent-wash:#EEF2FD; --err:#b42318;
    --card:clamp(220px, 26vw, 300px);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Pretendard','-apple-system',BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;
    word-break:keep-all;overflow-wrap:break-word}
  a{color:inherit}
  button{font:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:1320px;margin:0 auto;padding:36px 24px 96px}

  .mast{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
  .mast h1{margin:0;font-size:2.4rem;font-weight:800;letter-spacing:-.035em;line-height:.95}
  .mast .sub{font-size:13px;color:var(--mut);margin-top:8px;font-variant-numeric:tabular-nums}
  .weeks{display:flex;gap:6px;flex-wrap:wrap}
  .weeks button{border:1px solid var(--line2);background:var(--paper);padding:7px 12px;font-size:13px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
  .weeks button:hover{border-color:var(--accent);color:var(--accent)}
  .weeks button.on{border-color:var(--ink);background:var(--ink);color:#fff}

  .jump{display:flex;gap:4px;margin-top:4px;position:sticky;top:0;background:var(--paper);z-index:5;border-bottom:1px solid var(--line)}
  .jump a{text-decoration:none;padding:12px 14px;font-size:14px;font-weight:700;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
  .jump a:hover{color:var(--ink)}
  .jump a.on{color:var(--accent);border-bottom-color:var(--accent)}

  section.deck{padding:34px 0 8px;scroll-margin-top:52px}
  .deck-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
  .deck-head .tag{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--accent)}
  .deck-head h2{margin:0;font-size:1.45rem;font-weight:800;letter-spacing:-.025em}
  .deck-head .n{margin-left:auto;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}

  .strip{display:grid;grid-auto-flow:column;grid-auto-columns:var(--card);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin}
  .strip button{all:unset;cursor:zoom-in;scroll-snap-align:start;display:block;position:relative}
  .strip img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--wash);border:1px solid var(--line);transition:transform .18s ease,border-color .18s ease}
  .strip button:hover img,.strip button:focus-visible img{transform:translateY(-3px);border-color:var(--line2)}
  .strip button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  details.src{margin-top:4px;font-size:13px;color:var(--mut)}
  details.src summary{cursor:pointer;font-weight:600;padding:6px 0;list-style:none}
  details.src summary::-webkit-details-marker{display:none}
  details.src summary::before{content:'+ '}
  details.src[open] summary::before{content:'– '}
  details.src ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  details.src li a{display:inline-block;border:1px solid var(--line2);padding:4px 9px;font-size:12px;font-weight:600;color:var(--mut);text-decoration:none}
  details.src li a:hover{border-color:var(--accent);color:var(--accent)}

  /* 자세히 판 = 이야기 카드 바로 다음 장 (stories.json) — 사진 · 제목 · 굵은 강조 3~4줄 · 그래서 · 출처 */
  .dcard{grid-column:span 2;height:calc(var(--card) * 1.25);scroll-snap-align:start;display:grid;grid-template-columns:44% minmax(0,1fr);border:1px solid var(--line2);background:var(--paper);cursor:zoom-in;overflow:hidden}
  .dcard.nophoto{grid-template-columns:1fr}
  .dcard .ph{width:100%;height:100%;object-fit:cover;display:block;background:var(--wash)}
  .dcard .bd{padding:20px 22px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
  .dcard .k{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
  .dcard h3{margin:-4px 0 0;font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
  .dcard .d{font-size:12px;font-weight:600;color:var(--mut);margin-top:-6px;font-variant-numeric:tabular-nums}
  .dcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .dcard li{position:relative;padding-left:14px;font-size:14px;line-height:1.55;color:var(--ink)}
  .dcard li::before{content:'';position:absolute;left:0;top:.62em;width:6px;height:6px;background:var(--accent)}
  .dcard strong{font-weight:800;color:var(--accent-dark)}
  .dcard .why{background:var(--accent-wash);padding:9px 11px;font-size:13.5px;line-height:1.5;font-weight:700;color:var(--accent-dark)}
  .dcard .why::before{content:'그래서  ';font-weight:800}
  .dcard .lk{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin-top:auto}
  .dcard .lk a{color:var(--mut);font-weight:600;text-underline-offset:2px}
  .dcard .lk a:hover{color:var(--accent)}
  .lb .dcard{grid-column:auto;height:auto;max-height:90dvh;width:min(860px,92vw);cursor:default}
  .lb .dcard .bd{padding:28px 30px 24px;gap:14px}
  .lb .dcard h3{font-size:24px}
  .lb .dcard li{font-size:16.5px}
  .lb .dcard .why{font-size:15.5px}

  .state{padding:64px 0;text-align:center;font-size:14px;color:var(--mut)}
  .state.err{color:var(--err)}

  /* 크게 보기 */
  .lb{position:fixed;inset:0;background:rgba(10,10,12,.92);display:none;align-items:center;justify-content:center;z-index:50}
  .lb.on{display:flex}
  .lb > img{max-height:92dvh;max-width:92vw;aspect-ratio:4/5;object-fit:contain;display:block}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.12);color:#fff;width:52px;height:52px;font-size:26px;line-height:1}
  .lb .nav:hover{background:rgba(255,255,255,.24)}
  .lb .prev{left:18px} .lb .next{right:18px}
  .lb .x{position:absolute;top:14px;right:16px;border:0;background:none;color:#fff;font-size:30px;line-height:1;padding:6px 10px}
  .lb .cnt{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}

  @media (max-width:860px){
    .dcard{grid-column:span 1;grid-template-columns:1fr;grid-template-rows:34% minmax(0,1fr)}
    .dcard.nophoto{grid-template-rows:1fr}
    .dcard .bd{padding:16px 16px 14px;gap:8px}
    .dcard h3{font-size:16px}
    .dcard li{font-size:13.5px}
    .lb .dcard{grid-template-columns:1fr;grid-template-rows:auto auto;width:92vw;max-height:86dvh;overflow-y:auto}
    .lb .dcard .ph{max-height:30dvh}
    .lb .dcard .bd{overflow:visible}
    .wrap{padding:24px 16px 72px}
    .mast h1{font-size:2rem}
    :root{--card:72vw}
    .strip{margin:0 -16px;padding:0 16px 12px;scroll-padding:0 16px}
    .jump{overflow-x:auto;scrollbar-width:none;margin:4px -16px 0;padding:0 8px}
    .jump::-webkit-scrollbar{display:none}
    .jump a{flex:none}
    .lb .nav{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <h1>Trends</h1>
      <div class="sub" id="sub">주간 카드뉴스</div>
    </div>
    <div class="weeks" id="weeks"></div>
  </header>
  <nav class="jump" id="jump"></nav>
  <div id="decks"><div class="state" id="state">불러오는 중…</div></div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="카드 크게 보기">
  <button class="x" id="lbx" aria-label="닫기">×</button>
  <button class="nav prev" id="lbp" aria-label="이전">‹</button>
  <button class="nav next" id="lbn" aria-label="다음">›</button>
  <div class="cnt" id="lbc"></div>
</div>

<script>
(function(){
  var BASE = './data/card-news/';
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var bust = '?t=' + Math.floor(Date.now() / 600000);
  var idx = null, cur = null, lb = { list:[], i:0 };

  function fmt(w){ var d = new Date(w + 'T00:00:00'); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }

  function paintWeeks(){
    $('weeks').innerHTML = idx.weeks.slice(0, 8).map(function(w){
      return '<button data-w="' + esc(w.week) + '" class="' + (w.week === cur ? 'on' : '') + '">' + esc(fmt(w.week)) + '</button>';
    }).join('');
  }

  // 카드 순서에 「자세히」 판을 끼운다: 이야기의 slide 번호 카드 바로 뒤
  function seq(t){
    var out = [], by = {};
    (t.stories || []).forEach(function(st){ if (st.slide) (by[st.slide] = by[st.slide] || []).push(st); });
    t.slides.forEach(function(s, i){ out.push({ kind:'img', s:s, n:i + 1 }); (by[i + 1] || []).forEach(function(st){ out.push({ kind:'detail', st:st }); }); });
    return out;
  }
  function bold(x){ return esc(x).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
  function detailHtml(x, extra, tid, j){
    var pts = (x.points && x.points.length ? x.points : [x.summary]).map(function(p){ return '<li>' + bold(p) + '</li>'; }).join('');
    return '<div class="dcard' + (x.image ? '' : ' nophoto') + (extra ? ' ' + extra : '') + '"' + (tid ? ' data-t="' + esc(tid) + '" data-j="' + j + '"' : '') + '>' +
      (x.image ? '<img class="ph" src="' + esc(x.image) + '" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'nophoto\');this.remove()">' : '') +
      '<div class="bd"><span class="k">자세히</span><h3>' + esc(x.title) + '</h3>' + (x.date ? '<div class="d">' + esc(x.date) + '</div>' : '') +
      '<ul>' + pts + '</ul>' + (x.why ? '<div class="why">' + esc(x.why) + '</div>' : '') +
      (x.sources && x.sources.length ? '<div class="lk">' + x.sources.map(function(q){ return '<a href="' + esc(q.url) + '" target="_blank" rel="noopener">' + esc(q.name) + '</a>'; }).join('') + '</div>' : '') +
      '</div></div>';
  }

  function load(week){
    cur = week; paintWeeks();
    $('decks').innerHTML = '<div class="state">불러오는 중…</div>';
    fetch(BASE + week + '/meta.json' + bust).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(m){
        if (cur !== week) return;
        $('sub').textContent = fmt(week) + ' · ' + m.topics.length + '개 분야 · 카드 ' + m.topics.reduce(function(a, t){ return a + t.slides.length; }, 0) + '장 · 이야기 ' + m.topics.reduce(function(a, t){ return a + (t.stories || []).length; }, 0) + '개';
        $('jump').innerHTML = m.topics.map(function(t, i){ return '<a href="#d-' + esc(t.id) + '" class="' + (i ? '' : 'on') + '">' + esc(t.name) + '</a>'; }).join('');
        $('decks').innerHTML = m.topics.map(function(t){
          var imgs = seq(t).map(function(it, j){
            if (it.kind === 'img') return '<button data-t="' + esc(t.id) + '" data-j="' + j + '" aria-label="' + esc(t.name + ' ' + (it.n) + '장: ' + it.s.headline) + '">' +
              '<img src="' + BASE + esc(week + '/' + it.s.img) + '" alt="' + esc(it.s.headline) + '" loading="lazy" width="1080" height="1350"></button>';
            return detailHtml(it.st, '', t.id, j);
          }).join('');
          var src = t.sources && t.sources.length ? '<details class="src"><summary>출처 ' + t.sources.length + '곳</summary><ul>' +
            t.sources.map(function(s){ return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.host) + '</a></li>'; }).join('') + '</ul></details>' : '';
          return '<section class="deck" id="d-' + esc(t.id) + '"><div class="deck-head"><span class="tag">' + esc(t.name) + '</span><h2>' + esc(t.title) + '</h2>' +
            '<span class="n">' + t.slides.length + '장 →</span></div><div class="strip">' + imgs + '</div>' + src + '</section>';
        }).join('');
        window._cn = m;
        spy();
      })
      .catch(function(e){ $('decks').innerHTML = '<div class="state err">이번 주 카드를 불러오지 못했어요 (' + esc(e.message) + ')</div>'; });
  }

  // 지금 보고 있는 분야를 위 탭에 표시
  function spy(){
    var secs = [].slice.call(document.querySelectorAll('section.deck'));
    if (!('IntersectionObserver' in window) || !secs.length) return;
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if (e.isIntersecting) [].forEach.call($('jump').children, function(a){ a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id); }); });
    }, { rootMargin:'-12% 0px -80% 0px' });
    secs.forEach(function(s){ io.observe(s); });
  }

  function openLb(tid, j){
    var t = (window._cn.topics || []).filter(function(x){ return x.id === tid; })[0]; if (!t) return;
    lb.name = t.name; lb.list = seq(t); lb.i = j; showLb(); $('lb').classList.add('on'); $('lbx').focus();
  }
  function showLb(){
    var it = lb.list[lb.i], old = $('lbi'); if (old) old.remove();
    var el;
    if (it.kind === 'img') { el = document.createElement('img'); el.src = BASE + cur + '/' + it.s.img; el.alt = it.s.headline; }
    else { var w = document.createElement('div'); w.innerHTML = detailHtml(it.st, ''); el = w.firstChild; }
    el.id = 'lbi'; $('lb').insertBefore(el, $('lbn'));
    var cards = lb.list.filter(function(x){ return x.kind === 'img'; }).length;
    $('lbc').textContent = lb.name + ' · ' + (it.kind === 'img' ? it.n + ' / ' + cards : '자세히');
  }
  function step(d){ lb.i = (lb.i + d + lb.list.length) % lb.list.length; showLb(); }
  function closeLb(){ $('lb').classList.remove('on'); }

  $('weeks').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b && b.dataset.w !== cur) load(b.dataset.w); });
  $('decks').addEventListener('click', function(e){ if (e.target.closest('a')) return; var b = e.target.closest('.strip button, .strip .dcard'); if (b) openLb(b.dataset.t, +b.dataset.j); });
  $('lbp').onclick = function(){ step(-1); }; $('lbn').onclick = function(){ step(1); }; $('lbx').onclick = closeLb;
  $('lb').addEventListener('click', function(e){ if (e.target === $('lb')) closeLb(); });
  document.addEventListener('keydown', function(e){
    if (!$('lb').classList.contains('on')) return;
    if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
  });
  var tx = null;
  $('lb').addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; }, { passive:true });
  $('lb').addEventListener('touchend', function(e){ if (tx == null) return; var dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); tx = null; });

  fetch(BASE + 'index.json' + bust).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){
      idx = j; if (!idx.weeks || !idx.weeks.length) throw new Error('아직 만든 주가 없어요');
      load(idx.weeks[0].week); // 늘 최신 주부터 (지난 주는 위 칩으로)
    })
    .catch(function(e){ $('state').className = 'state err'; $('state').textContent = '카드뉴스 목록을 불러오지 못했어요 (' + e.message + ')'; });
})();
</script>
</body>
</html>
